title: Allegro API
description: How the Allegro steps work, and the everyday steps.
components:
- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    The steps call the Allegro REST API for the connected account. Every documented operation has a step: 276 steps in all, the everyday ones first.

    - **Permissions.** Each step names the Allegro permission it needs. Your Allegro application must have it, or Allegro refuses the step and nothing changes.
    - **Results.** A generated step returns `status`, `data` (Allegro's JSON) or `file` (a workflow file for PDFs, labels and attachments), `location`, `etag` and `warnings`.
    - **Request bodies** are given as JSON in `body`, exactly as Allegro documents them; amounts as text such as "49.99".
    - **Accepted or completed.** Every step that changes data returns `processing`: `completed` when Allegro answered that the change is made, `accepted` when Allegro registered a command or accepted the request (HTTP 202) and applies it afterwards. With `accepted`, `applied` is false and `check` names the step that reads the outcome and the address Allegro returned for it.
    - **Changes are sent once.** A step that changes data is never retried automatically; when its outcome is unclear it says so, and you check Allegro before running it again. Test runs never send changes.
    - **Rate limit.** When Allegro answers that a limit is reached (HTTP 429) the step stops, says how long Allegro asks to wait, and nothing is changed.

    The steps by area:

    - **Offers** (58 steps)
    - **Products and categories** (33 steps)
    - **Pricing and promotion** (52 steps)
    - **Orders and returns** (46 steps)
    - **Delivery and shipping** (44 steps)
    - **Account and fulfillment** (37 steps)
- component_id: steps_everyday
  type: markdown
  title: Everyday
  body: |
    ### Test connection

    Checks that Allegro accepts the connection's authorization by reading the account it belongs to (GET /me). Returns the user id and login. Needs the Allegro permission allegro:api:profile:read.

    Action id `test_connection` · reads only · Allegro: `GET /me`

    Inputs: none.

    Results: `connected`, `user_id`, `login`, `environment`, `warnings`.

    ### Get all my offers

    Reads the seller's offers page by page (GET /sale/offers, up to 1000 per page) until all are read or the step output (or, with output file, a JSON workflow file) is full, filtered by name, offer IDs, external IDs, publication status or category. When the output is full or time runs out the step returns what it read with complete false and next_offset to start the next step from. Needs allegro:api:sale:offers:read.

    Action id `list_all_my_offers` · reads only · Allegro: `GET /sale/offers`

    Inputs: `name`, `offer_ids`, `external_ids`, `publication_status`, `category_id`, `start_offset`, `max_offers`, `output`.

    Results: `offers`, `file`, `count`, `total_count`, `complete`, `next_offset`, `warnings`.

    ### Update stock and prices

    Sets the stock and the Buy Now price of many offers with Allegro's batch commands: offers with the same new stock or the same new price go into one command of up to 1000 offers. Each command ID is derived from batch_key and the command's content, so running the step again with the same rows and batch key never registers a change twice: Allegro answers that the command already exists. The step confirms that Allegro registered the commands (processing accepted, applied false); Allegro applies them afterwards, and Get stock and price update results reads the outcome per offer. When Allegro certainly refuses a command after earlier ones were registered, or time runs out before the next one is sent, the step still succeeds: each command has its status, applied is empty and a warning says what to fix before running it again. Stock must be at least 1 and a price is an exact decimal with at most two places. Needs allegro:api:sale:offers:write.

    Action id `update_stock_and_prices` · changes data in Allegro · Allegro: `PUT /sale/offer-quantity-change-commands/{commandId}`, `PUT /sale/offer-price-change-commands/{commandId}`

    Inputs: `rows` (required), `batch_key` (required).

    Results: `commands`, `offers_count`, `processing`, `applied`, `check`, `warnings`.

    ### Get stock and price update results

    Reads how far Allegro got with the commands of Update stock and prices: per command the number of offers done, failed and waiting, and for failed offers the offer ID and Allegro's reason. Give the commands output of that step. Needs allegro:api:sale:offers:write (Allegro asks for it to read the reports).

    Action id `get_stock_and_price_update_results` · reads only · Allegro: `GET /sale/offer-quantity-change-commands/{commandId}`, `GET /sale/offer-quantity-change-commands/{commandId}/tasks`, `GET /sale/offer-price-change-commands/{commandId}`, `GET /sale/offer-price-change-commands/{commandId}/tasks`

    Inputs: `commands` (required).

    Results: `commands`, `all_completed`, `failed_count`, `warnings`.

    ### Get orders

    Reads the seller's orders (checkout forms) page by page (GET /order/checkout-forms, up to 100 per page) until all are read or the step output (or, with output file, a JSON workflow file) is full, filtered by status, seller status, buyer and dates. Returns complete false and next_offset when it stops early. Needs allegro:api:orders:read.

    Action id `list_orders` · reads only · Allegro: `GET /order/checkout-forms`

    Inputs: `status`, `fulfillment_status`, `updated_from`, `updated_to`, `bought_from`, `bought_to`, `buyer_login`, `sort`, `start_offset`, `max_orders`, `output`.

    Results: `orders`, `file`, `count`, `total_count`, `complete`, `next_offset`, `warnings`.

    ### Get order events

    Reads order events (bought, filled in, paid, cancelled, seller status changed…) after the event ID given, page by page (GET /order/events, up to 1000 per page). Keep last_event_id and pass it as after_event_id next time to read only new events. Needs allegro:api:orders:read.

    Action id `list_order_events` · reads only · Allegro: `GET /order/events`

    Inputs: `after_event_id`, `types`, `max_events`.

    Results: `events`, `count`, `last_event_id`, `complete`, `warnings`.
