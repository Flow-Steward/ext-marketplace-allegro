title: 'Allegro API: Pricing and promotion'
description: The 52 pricing and promotion steps.
components:
- component_id: steps_pricing
  type: markdown
  title: Pricing
  body: |
    ### Get offer quotes

    This endpoint returns current offer quotes (listing and promo fees) cycles for authenticated user and list of offers. Needs the Allegro permission allegro:api:billing:read.

    Action id `get_offer_quotes` · reads only · Allegro: `GET /pricing/offer-quotes`

    Inputs: `offer_id` (required), `accept_language`.

    ### Calculate offer fee and commission

    Provides information about fee and commission for an offer. This resource is limited to 25 requests per second for a single user. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `calculate_offer_fee_and_commission` · reads only · Allegro: `POST /pricing/offer-fee-preview`

    Inputs: `accept_language`, `body` (required).
- component_id: steps_automatic_pricing
  type: markdown
  title: Automatic pricing
  body: |
    ### Get automatic pricing rules

    Use this resource to get automatic pricing rules. Rules with property default set to true are default rules created by Allegro for each merchant. This resource is rate limited to 5 requests per second. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_automatic_pricing_rules` · reads only · Allegro: `GET /sale/price-automation/rules`

    Inputs: `accept_language`.

    ### Get automatic pricing rule

    Use this resource to get automatic pricing rule by id. Rules with property default set to true are default rules created by Allegro for each merchant and cannot be modified. This resource is rate limited to 5 requests per second. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_automatic_pricing_rule` · reads only · Allegro: `GET /sale/price-automation/rules/{ruleId}`

    Inputs: `rule_id` (required), `accept_language`.

    ### Get automatic pricing rules of offer

    Use this resource to get automatic pricing rules for offer. This resource is rate limited to 5 requests per second. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_automatic_pricing_rules_of_offer` · reads only · Allegro: `GET /sale/price-automation/offers/{offerId}/rules`

    Inputs: `offer_id` (required), `accept_language`.

    ### Create automatic pricing rule

    Use this resource to create automatic pricing rule. This resource is rate limited to 5 requests per second. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `create_automatic_pricing_rule` · changes data in Allegro · Allegro: `POST /sale/price-automation/rules`

    Inputs: `accept_language`, `body` (required).

    ### Update automatic pricing rule

    Use this resource to update automatic pricing rule. This resource is rate limited to 5 requests per second. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `update_automatic_pricing_rule` · changes data in Allegro · Allegro: `PUT /sale/price-automation/rules/{ruleId}`

    Inputs: `rule_id` (required), `accept_language`, `body` (required).

    ### Delete automatic pricing rule

    Use this resource to delete automatic pricing rule. This resource is rate limited to 5 requests per second. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `delete_automatic_pricing_rule` · changes data in Allegro · Allegro: `DELETE /sale/price-automation/rules/{ruleId}`

    Inputs: `rule_id` (required), `accept_language`.
- component_id: steps_allegro_prices
  type: markdown
  title: Allegro Prices
  body: |
    ### Get Allegro Prices participation

    Use this resource to retrieve the account participation status for all supported marketplaces in the Allegro Prices program. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_allegro_prices_participation` · reads only · Allegro: `GET /sale/allegro-prices/accounts/participations`

    Inputs: `accept_language`.

    ### Get Allegro Prices submission status

    Use this resource to retrieve the status and details of a previously submitted offer command. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_allegro_prices_submission_status` · reads only · Allegro: `GET /sale/allegro-prices/offers/submit-offer-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get Allegro Prices exclusion status

    Use this resource to retrieve the status and details of a previously submitted exclusion command. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_allegro_prices_exclusion_status` · reads only · Allegro: `GET /sale/allegro-prices/offers/exclusion-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Submit offers to Allegro Prices

    Use this resource to submit a command to add offers to the Allegro Prices program. Returns a command ID that can be used to track the processing status. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get Allegro Prices submission status. Needs the Allegro permission allegro:api:campaigns.

    Action id `submit_offers_to_allegro_prices` · changes data in Allegro · Allegro: `POST /sale/allegro-prices/offers/submit-offer-commands`

    Inputs: `accept_language`, `body` (required).

    ### Exclude offers from Allegro Prices

    Use this resource to submit a command to exclude offers from the Allegro Prices program. Returns a command ID that can be used to track the processing status. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get Allegro Prices exclusion status. Needs the Allegro permission allegro:api:campaigns.

    Action id `exclude_offers_from_allegro_prices` · changes data in Allegro · Allegro: `POST /sale/allegro-prices/offers/exclusion-commands`

    Inputs: `accept_language`, `body` (required).

    ### Query Allegro Prices status of offers

    Use this resource to retrieve a list of offers and their status in the Allegro Prices program with optional filtering and pagination. Allows filtering by offer IDs, marketplace, and scope (WITH_DECLARATION, DISCOUNTED, or EXCLUDED). Only offers in ACTIVATING, ACTIVE, or ENDED statuses are considered. Needs the Allegro permission allegro:api:campaigns.

    Action id `query_allegro_prices_status_of_offers` · reads only · Allegro: `POST /sale/allegro-prices/offers-queries`

    Inputs: `accept_language`, `body` (required).

    ### Update Allegro Prices participation

    Use this resource to update the account participation status for one or more marketplaces in the Allegro Prices program. Needs the Allegro permission allegro:api:campaigns.

    Action id `update_allegro_prices_participation` · changes data in Allegro · Allegro: `PATCH /sale/allegro-prices/accounts/participations`

    Inputs: `accept_language`, `body` (required).
- component_id: steps_alle_discount
  type: markdown
  title: AlleDiscount
  body: |
    ### Get AlleDiscount submission status

    Use this resource to get information about the submit offer command execution status. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_alle_discount_submission_status` · reads only · Allegro: `GET /sale/alle-discount/submit-offer-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get AlleDiscount withdrawal status

    Use this resource to get information about the withdrawal command execution status. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_alle_discount_withdrawal_status` · reads only · Allegro: `GET /sale/alle-discount/withdraw-offer-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get offers eligible for AlleDiscount

    Endpoint returning info about offers that can be submitted to a given AlleDiscount campaign. Only offer linked to the product in published list of goods (products) can be submitted to a given AlleDiscount campaign. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_offers_eligible_for_alle_discount` · reads only · Allegro: `GET /sale/alle-discount/{campaignId}/eligible-offers`

    Inputs: `campaign_id` (required), `limit`, `offset`, `meets_conditions`, `offer_id`, `accept_language`.

    ### Get offers submitted to AlleDiscount

    Endpoint returning info about offer participations for a given AlleDiscount campaign. With this endpoint you are able to validate if the offer participates in AlleDiscount and if it has lowered price on the platform. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_offers_submitted_to_alle_discount` · reads only · Allegro: `GET /sale/alle-discount/{campaignId}/submitted-offers`

    Inputs: `campaign_id` (required), `limit`, `offset`, `offer_id`, `participation_id`, `accept_language`.

    ### Get AlleDiscount campaigns

    List current AlleDiscount campaigns. Each campaign has its own list of goods (products) that indicate which offers can be submitted to it. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_alle_discount_campaigns` · reads only · Allegro: `GET /sale/alle-discount/campaigns`

    Inputs: `campaign_id`, `accept_language`.

    ### Submit offer to AlleDiscount

    Use this resource to create a command for submitting an offer. Offer will be submitted to the AlleDiscount campaign only if command is processed successfully. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get AlleDiscount submission status. Needs the Allegro permission allegro:api:campaigns.

    Action id `submit_offer_to_alle_discount` · changes data in Allegro · Allegro: `POST /sale/alle-discount/submit-offer-commands`

    Inputs: `accept_language`, `body` (required).

    ### Withdraw offer from AlleDiscount

    Use this resource to create a command for withdrawing an offer from specific campaign. Offer will be withdrawn from the AlleDiscount campaign only if command is processed successfully. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get AlleDiscount withdrawal status. Needs the Allegro permission allegro:api:campaigns.

    Action id `withdraw_offer_from_alle_discount` · changes data in Allegro · Allegro: `POST /sale/alle-discount/withdraw-offer-commands`

    Inputs: `accept_language`, `body` (required).
- component_id: steps_badge_campaigns
  type: markdown
  title: Badge campaigns
  body: |
    ### Get badge campaigns

    Badge campaigns are another way to promote your offers. You can apply for a badge, which - depending on a type - will be displayed on your offer page of on the list of offers. First - use this resource to get a list of all available badge campaigns at the moment, then use *POST /sale/badges* to apply for badge. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_badge_campaigns` · reads only · Allegro: `GET /sale/badge-campaigns`

    Inputs: `marketplace_id`, `accept_language`.

    ### Get badges

    Use this resource to get a list of badges in authorized seller's offers. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_badges` · reads only · Allegro: `GET /sale/badges`

    Inputs: `offer_id`, `marketplace_id` (required), `offset`, `limit`, `accept_language`.

    ### Get badge application

    Use this resource to get a badge application details. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_badge_application` · reads only · Allegro: `GET /sale/badge-applications/{applicationId}`

    Inputs: `application_id` (required), `accept_language`.

    ### Get badge applications

    Use this resource to get a list of badge applications. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_badge_applications` · reads only · Allegro: `GET /sale/badge-applications`

    Inputs: `campaign_id`, `offer_id`, `offset`, `limit`, `accept_language`.

    ### Get badge operation

    Use this resource to get badge operation details. Needs the Allegro permission allegro:api:campaigns.

    Action id `get_badge_operation` · reads only · Allegro: `GET /sale/badge-operations/{operationId}`

    Inputs: `operation_id` (required), `accept_language`.

    ### Apply for badge

    This resource allows you to apply for a badge. Most badges involve additional fee charged. Your badge application will be verified and you will be notified about the verification status via e-mail. You can use *Location* provided in header of the response to track your application status. Application will be removed after 30 days when status of the application was changed form PROCESSED or DECLINED. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get badge application. Needs the Allegro permission allegro:api:campaigns.

    Action id `apply_for_badge` · changes data in Allegro · Allegro: `POST /sale/badges`

    Inputs: `accept_language`, `body`.

    ### Update offer badge

    This resource allows you to update a campaign badge for the given offer. You can use *Location* provided in header of the response to track your update status. Update offer price in a campaign or finish marking an offer in a campaign. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get badge operation. Needs the Allegro permission allegro:api:campaigns.

    Action id `update_offer_badge` · changes data in Allegro · Allegro: `PATCH /sale/badges/offers/{offerId}/campaigns/{campaignId}`

    Inputs: `offer_id` (required), `campaign_id` (required), `accept_language`, `body`.
- component_id: steps_rebates_and_promotions
  type: markdown
  title: Rebates and promotions
  body: |
    ### Get promotions

    Get a list of promotions defined by the authorized user and filtered by promotion type. Restrictions: Filtering by promotion type is required. Sum of limit and offset must be equal to or lower than 50000. Limit must be equal to or lower than 5000. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_promotions` · reads only · Allegro: `GET /sale/loyalty/promotions`

    Inputs: `limit`, `offset`, `offer_id`, `promotion_type` (required), `accept_language`.

    ### Get promotion

    Use this resource to return the requested promotion. You need to use its unique id., Wholesale price list, Multipack. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_promotion` · reads only · Allegro: `GET /sale/loyalty/promotions/{promotionId}`

    Inputs: `promotion_id` (required), `accept_language`.

    ### Create promotion

    This endpoint creates a new promotion. You can create promotions only if your base marketplace is allegro-pl. Created promotions are visible only on the allegro-pl marketplace. You can define the following types of promotions: 1. Large order discount Only company users will see and be eligible for this type of promotion. In order to create a large order discount, you also have to be a company user. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `create_promotion` · changes data in Allegro · Allegro: `POST /sale/loyalty/promotions`

    Inputs: `accept_language`, `body` (required).

    ### Update promotion

    Use this resource to update a promotion by its unique id. It supports editing bundle's discount, wholesale price lists and large order discounts., Wholesale price list. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `update_promotion` · changes data in Allegro · Allegro: `PUT /sale/loyalty/promotions/{promotionId}`

    Inputs: `promotion_id` (required), `accept_language`, `body` (required).

    ### Deactivate promotion

    Use this resource to deactivate the requested promotion. You need to use its unique id., Wholesale price list, Multipack. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `deactivate_promotion` · changes data in Allegro · Allegro: `DELETE /sale/loyalty/promotions/{promotionId}`

    Inputs: `promotion_id` (required), `accept_language`.
- component_id: steps_offer_bundles
  type: markdown
  title: Offer bundles
  body: |
    ### Get offer bundles

    You can fetch page of seller's offer bundles using this endpoint. Paging: To move to next page, specify page.id parameter with value obtained in response from previous request. Number of offer bundles on single page can be specified using limit parameter. Filtering: Offer bundles can be filtered to bundles which contain offer specified in offer.id parameter. Allegro marks this operation as deprecated. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offer_bundles` · reads only · Allegro: `GET /sale/bundles`

    Inputs: `limit`, `offer_id`, `page_id`, `accept_language`.

    ### Get offer bundle

    Use this resource to retrieve offer bundle by its unique identifier. Allegro marks this operation as deprecated. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offer_bundle` · reads only · Allegro: `GET /sale/bundles/{bundleId}`

    Inputs: `bundle_id` (required), `accept_language`.

    ### Update offer bundle discount

    Use this resource to update discount per marketplaces associated with bundle specified by its unique identifier. This will override currently set discounts for all marketplaces, so the unchanged discounts also must be specified in request. In case discount for marketplace is not specified in request it will be deleted. Allegro marks this operation as deprecated. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `update_offer_bundle_discount` · changes data in Allegro · Allegro: `PUT /sale/bundles/{bundleId}/discount`

    Inputs: `bundle_id` (required), `accept_language`, `body` (required).

    ### Delete offer bundle

    Use this resource to delete offer bundle by its unique identifier. Allegro marks this operation as deprecated. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `delete_offer_bundle` · changes data in Allegro · Allegro: `DELETE /sale/bundles/{bundleId}`

    Inputs: `bundle_id` (required), `accept_language`.
- component_id: steps_flexible_bundles
  type: markdown
  title: Flexible bundles
  body: |
    ### Get flexible bundles

    You can fetch page of seller's flexible bundles using this endpoint. Paging: To move to next page, specify page.id parameter with value obtained in response from previous request. Number of offer bundles on single page can be specified using limit parameter. Filtering: Offer bundles can be filtered to bundles which contain offer specified in offer.id parameter. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_flexible_bundles` · reads only · Allegro: `GET /sale/flexible-bundles`

    Inputs: `limit`, `offer_id`, `page_id`.

    ### Get flexible bundle

    Use this resource to retrieve flexible bundle by its unique identifier. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_flexible_bundle` · reads only · Allegro: `GET /sale/flexible-bundles/{bundleId}`

    Inputs: `bundle_id` (required).

    ### Create flexible bundle

    You can create flexible bundle using this resource. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `create_flexible_bundle` · changes data in Allegro · Allegro: `POST /sale/flexible-bundles`

    Inputs: `body` (required).

    ### Update flexible bundle

    You can update flexible bundle using this resource. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `update_flexible_bundle` · changes data in Allegro · Allegro: `PUT /sale/flexible-bundles/{bundleId}`

    Inputs: `bundle_id` (required), `body` (required).

    ### Delete flexible bundle

    Use this resource to delete flexible bundle by its unique identifier. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `delete_flexible_bundle` · changes data in Allegro · Allegro: `DELETE /sale/flexible-bundles/{bundleId}`

    Inputs: `bundle_id` (required).
- component_id: steps_additional_services
  type: markdown
  title: Additional services
  body: |
    ### Get additional services groups

    Use this resource to retrieve a list of groups with additional services available to a given user which you may assign to offers. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_additional_services_groups` · reads only · Allegro: `GET /sale/offer-additional-services/groups`

    Inputs: `offset`, `limit`, `accept_language`.

    ### Get additional service definitions

    Use this resource to get additional services definitions, grouped by additional services categories, available on given marketplace. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_additional_service_definitions` · reads only · Allegro: `GET /sale/offer-additional-services/categories`

    Inputs: `accept_language`.

    ### Get additional services group

    Use this resource to get additional services group for a given ID. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_additional_services_group` · reads only · Allegro: `GET /sale/offer-additional-services/groups/{groupId}`

    Inputs: `group_id` (required), `accept_language`.

    ### Create additional services group

    Use this resource to create a group of additional services. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_additional_services_group` · changes data in Allegro · Allegro: `POST /sale/offer-additional-services/groups`

    Inputs: `accept_language`, `body` (required).

    ### Update additional services group

    Use this resource to modify existing additional service group. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_additional_services_group` · changes data in Allegro · Allegro: `PUT /sale/offer-additional-services/groups/{groupId}`

    Inputs: `group_id` (required), `accept_language`, `body` (required).
- component_id: steps_additional_services_translations
  type: markdown
  title: Additional services translations
  body: |
    ### Get additional services group translations

    Use this resource to get translations for additional service group. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_additional_services_group_translations` · reads only · Allegro: `GET /sale/offer-additional-services/groups/{groupId}/translations`

    Inputs: `group_id` (required), `language`, `accept_language`.

    ### Update additional services group translation

    Use this resource to create/update translation for additional service group and specified language. It is allowed to provide an incomplete list of services that belong to the group. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_additional_services_group_translation` · changes data in Allegro · Allegro: `PATCH /sale/offer-additional-services/groups/{groupId}/translations/{language}`

    Inputs: `group_id` (required), `language` (required), `accept_language`, `body` (required).

    ### Delete additional services group translation

    Use this resource to delete the translation for specified additional service group and language. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `delete_additional_services_group_translation` · changes data in Allegro · Allegro: `DELETE /sale/offer-additional-services/groups/{groupId}/translations/{language}`

    Inputs: `group_id` (required), `language` (required), `accept_language`.
- component_id: steps_charity
  type: markdown
  title: Charity
  body: |
    ### Search fundraising campaigns

    Use this resource to search fundraising campaigns. Beta in Allegro: it may still change. The specification names no Allegro permission for it.

    Action id `search_fundraising_campaigns` · reads only · Allegro: `GET /charity/fundraising-campaigns`

    Inputs: `limit` (required), `phrase` (required), `accept_language`.
