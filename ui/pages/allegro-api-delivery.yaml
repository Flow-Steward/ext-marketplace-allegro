title: 'Allegro API: Delivery and shipping'
description: The 44 delivery and shipping steps.
components:
- component_id: steps_shipment_management
  type: markdown
  title: Shipment management
  body: |
    ### Get delivery options for order

    Use this resource to retrieve two order characteristics. The first is a pre-populated request body for creating a shipment in SwA. The second is a list of possible delivery types for processing the order, including their maximums. Needs the Allegro permission allegro:api:shipments:write.

    Action id `get_delivery_options_for_order` · reads only · Allegro: `GET /shipment-management/delivery-proposals/{orderId}`

    Inputs: `order_id` (required).

    ### Get delivery services

    Use this resource to get delivery services available for user. It returns services provided by Allegro and contracts with carriers owned by user and configured by GUI. This resource is deprecated and will be removed in Q1 2027. Consider using the new resource '/shipment-management/delivery-proposals/{orderId}' resource instead. Allegro marks this operation as deprecated. Needs the Allegro permission allegro:api:shipments:write.

    Action id `get_delivery_services` · reads only · Allegro: `GET /shipment-management/delivery-services`

    Inputs: `accept_language`.

    ### Get shipment creation status

    Use this resource to get shipment creation status. Needs the Allegro permission allegro:api:shipments:write.

    Action id `get_shipment_creation_status` · reads only · Allegro: `GET /shipment-management/shipments/create-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get shipment cancellation status

    Use this resource to get parcel cancellation status. Needs the Allegro permission allegro:api:shipments:write.

    Action id `get_shipment_cancellation_status` · reads only · Allegro: `GET /shipment-management/shipments/cancel-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get shipment

    Use this resource to get parcel details. Needs the Allegro permission allegro:api:shipments:read.

    Action id `get_shipment` · reads only · Allegro: `GET /shipment-management/shipments/{shipmentId}`

    Inputs: `shipment_id` (required), `accept_language`.

    ### Get pickup request status

    Use this resource to get pickup request status. Needs the Allegro permission allegro:api:shipments:write.

    Action id `get_pickup_request_status` · reads only · Allegro: `GET /shipment-management/pickups/create-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get pickup

    Use this resource to get pickup details. Needs the Allegro permission allegro:api:shipments:read.

    Action id `get_pickup` · reads only · Allegro: `GET /shipment-management/pickups/{pickupId}`

    Inputs: `pickup_id` (required), `accept_language`.

    ### Create shipment

    Use this resource to create shipment for delivery. Please check also new resource '/shipment-management/delivery-proposals/{orderId}' to get prefilled request body for this resource. Needs the Allegro permission allegro:api:shipments:write.

    Action id `create_shipment` · changes data in Allegro · Allegro: `POST /shipment-management/shipments/create-commands`

    Inputs: `accept_language`, `body` (required).

    ### Cancel shipment

    Use this resource to cancel parcel. Needs the Allegro permission allegro:api:shipments:write.

    Action id `cancel_shipment` · changes data in Allegro · Allegro: `POST /shipment-management/shipments/cancel-commands`

    Inputs: `accept_language`, `body` (required).

    ### Download shipment labels

    Use this resource to get label for created shipment. Returned content type depends on created shipment. The answer is saved as a workflow file. Needs the Allegro permission allegro:api:shipments:read.

    Action id `download_shipment_labels` · changes data in Allegro · Allegro: `POST /shipment-management/label`

    Inputs: `accept_language`, `body` (required).

    ### Download shipment protocol

    Protocol availability depends on Carrier. The answer is saved as a workflow file. Needs the Allegro permission allegro:api:shipments:read.

    Action id `download_shipment_protocol` · changes data in Allegro · Allegro: `POST /shipment-management/protocol`

    Inputs: `accept_language`, `body` (required).

    ### Get pickup proposals

    Use this resource to get parcels pickup date proposals. Pickup takes place, when courier arrives to take parcels for shipment. Needs the Allegro permission allegro:api:shipments:write.

    Action id `get_pickup_proposals` · changes data in Allegro · Allegro: `POST /shipment-management/pickup-proposals`

    Inputs: `accept_language`, `body` (required).

    ### Request shipment pickup

    Use this resource to request a pickup of shipments. Needs the Allegro permission allegro:api:shipments:write.

    Action id `request_shipment_pickup` · changes data in Allegro · Allegro: `POST /shipment-management/pickups/create-commands`

    Inputs: `accept_language`, `body` (required).
- component_id: steps_delivery
  type: markdown
  title: Delivery
  body: |
    ### Get shipping rate sets

    Use this resource to get a list of seller's shipping rates. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_shipping_rate_sets` · reads only · Allegro: `GET /sale/shipping-rates`

    Inputs: `marketplace`, `accept_language`.

    ### Get shipping rate set

    Use this resource to get details of the given shipping rates set. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_shipping_rate_set` · reads only · Allegro: `GET /sale/shipping-rates/{id}`

    Inputs: `id` (required), `accept_language`.

    ### Get delivery settings

    Use this resource to get the delivery settings declared by the seller. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_delivery_settings` · reads only · Allegro: `GET /sale/delivery-settings`

    Inputs: `marketplace_id`, `accept_language`.

    ### Get delivery methods

    Use this resource to get a list of all delivery methods currently available on the platform, as well as those that have already been discontinued. The specification names no Allegro permission for it.

    Action id `get_delivery_methods` · reads only · Allegro: `GET /sale/delivery-methods`

    Inputs: `marketplace`, `accept_language`.

    ### Create shipping rate set

    Use this resource to create a new seller's shipping rates set. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_shipping_rate_set` · changes data in Allegro · Allegro: `POST /sale/shipping-rates`

    Inputs: `accept_language`, `body` (required).

    ### Update shipping rate set

    Use this resource to edit a new seller's shipping rates set. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_shipping_rate_set` · changes data in Allegro · Allegro: `PUT /sale/shipping-rates/{id}`

    Inputs: `id` (required), `accept_language`, `body` (required).

    ### Update delivery settings

    Use this resource to modify the delivery settings declared by the seller. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_delivery_settings` · changes data in Allegro · Allegro: `PUT /sale/delivery-settings`

    Inputs: `accept_language`, `body` (required).
- component_id: steps_points_of_service
  type: markdown
  title: Points of service
  body: |
    ### Get points of service

    Use this resource to get a list of points of service by seller ID. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_points_of_service` · reads only · Allegro: `GET /points-of-service`

    Inputs: `seller_id` (required), `country_code`, `accept_language`.

    ### Get point of service

    Use this resource to get a details of a point of service for a given ID. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_point_of_service` · reads only · Allegro: `GET /points-of-service/{id}`

    Inputs: `id` (required), `accept_language`.

    ### Create point of service

    Use this resource to create a point of service. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_point_of_service` · changes data in Allegro · Allegro: `POST /points-of-service`

    Inputs: `accept_language`, `body` (required).

    ### Update point of service

    Use this resource to modify a point of service. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_point_of_service` · changes data in Allegro · Allegro: `PUT /points-of-service/{id}`

    Inputs: `id` (required), `accept_language`, `body` (required).

    ### Delete point of service

    Use this resource to delete a point of service. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `delete_point_of_service` · changes data in Allegro · Allegro: `DELETE /points-of-service/{id}`

    Inputs: `id` (required), `accept_language`.
- component_id: steps_contacts
  type: markdown
  title: Contacts
  body: |
    ### Get offer contacts

    Use this resource to get details of many contacts. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_offer_contacts` · reads only · Allegro: `GET /sale/offer-contacts`

    Inputs: `accept_language`.

    ### Get offer contact

    Use this resource to get contact details. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_offer_contact` · reads only · Allegro: `GET /sale/offer-contacts/{id}`

    Inputs: `id` (required), `accept_language`.

    ### Create offer contact

    Use this resource to create a new contact. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_offer_contact` · changes data in Allegro · Allegro: `POST /sale/offer-contacts`

    Inputs: `accept_language`, `body` (required).

    ### Update offer contact

    Use this resource to modify contact details. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_offer_contact` · changes data in Allegro · Allegro: `PUT /sale/offer-contacts/{id}`

    Inputs: `id` (required), `accept_language`, `body` (required).
- component_id: steps_after_sale_services
  type: markdown
  title: After sale services
  body: |
    ### Get return policies

    Use this resource to get the seller's return policies. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_return_policies` · reads only · Allegro: `GET /after-sales-service-conditions/return-policies`

    Inputs: `limit`, `offset`, `accept_language`.

    ### Get return policy

    Use this resource to get a return policy details. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_return_policy` · reads only · Allegro: `GET /after-sales-service-conditions/return-policies/{returnPolicyId}`

    Inputs: `return_policy_id` (required), `accept_language`.

    ### Get implied warranties

    Use this resource to get the seller's implied warranties. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_implied_warranties` · reads only · Allegro: `GET /after-sales-service-conditions/implied-warranties`

    Inputs: `limit`, `offset`, `accept_language`.

    ### Get implied warranty

    Use this resource to get an implied warranty details. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_implied_warranty` · reads only · Allegro: `GET /after-sales-service-conditions/implied-warranties/{impliedWarrantyId}`

    Inputs: `implied_warranty_id` (required), `accept_language`.

    ### Get warranties

    Use this resource to get the seller's warranties. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_warranties` · reads only · Allegro: `GET /after-sales-service-conditions/warranties`

    Inputs: `limit`, `offset`, `accept_language`.

    ### Get warranty

    Use this resource to get a warranty details. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_warranty` · reads only · Allegro: `GET /after-sales-service-conditions/warranties/{warrantyId}`

    Inputs: `warranty_id` (required), `accept_language`.

    ### Create return policy

    Use this resource to create a return policy definition. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_return_policy` · changes data in Allegro · Allegro: `POST /after-sales-service-conditions/return-policies`

    Inputs: `accept_language`, `body` (required).

    ### Create implied warranty

    Use this resource to create an implied warranty definition. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_implied_warranty` · changes data in Allegro · Allegro: `POST /after-sales-service-conditions/implied-warranties`

    Inputs: `accept_language`, `body` (required).

    ### Create warranty

    Use this resource to create a warranty definition. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_warranty` · changes data in Allegro · Allegro: `POST /after-sales-service-conditions/warranties`

    Inputs: `accept_language`, `body` (required).

    ### Create warranty attachment

    You can attach PDF files to warranties. Uploading attachments flow: 1. Create an attachment object to receive an upload URL (*POST /after-sales-service-conditions/attachments*), 2. Use the upload URL to submit the PDF file (*PUT /after-sales-service-conditions/attachments/{attachmentId}*), 3. Create (or update) warranty with attachment (*POST /after-sales-service-conditions/warranties*). Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_warranty_attachment` · changes data in Allegro · Allegro: `POST /after-sales-service-conditions/attachments`

    Inputs: `accept_language`, `body` (required).

    ### Update return policy

    Use this resource to modify the return policy details. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_return_policy` · changes data in Allegro · Allegro: `PUT /after-sales-service-conditions/return-policies/{returnPolicyId}`

    Inputs: `return_policy_id` (required), `accept_language`, `body` (required).

    ### Update implied warranty

    Use this resource to modify the implied warranty details. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_implied_warranty` · changes data in Allegro · Allegro: `PUT /after-sales-service-conditions/implied-warranties/{impliedWarrantyId}`

    Inputs: `implied_warranty_id` (required), `accept_language`, `body` (required).

    ### Update warranty

    Use this resource to modify the warranty details. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_warranty` · changes data in Allegro · Allegro: `PUT /after-sales-service-conditions/warranties/{warrantyId}`

    Inputs: `warranty_id` (required), `accept_language`, `body` (required).

    ### Upload warranty attachment file

    Upload an after sale services attachment. This operation should be used after creating an offer attachment with *POST /sale/offer-attachments* Important! You can find the URL address to upload the file to our server in the *Location* response header of *POST /after-sales-service-conditions/attachments*. The URL is unique and one-time. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `upload_warranty_attachment_file` · changes data in Allegro · Allegro: `PUT /after-sales-service-conditions/attachments/{attachmentId}`

    Inputs: `attachment_id` (required), `accept_language`, `file`, `content_type`.

    ### Delete return policy

    Use this resource to delete a return policy definition. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `delete_return_policy` · changes data in Allegro · Allegro: `DELETE /after-sales-service-conditions/return-policies/{returnPolicyId}`

    Inputs: `return_policy_id` (required), `accept_language`.
