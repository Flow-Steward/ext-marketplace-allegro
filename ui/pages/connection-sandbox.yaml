page_id: connection-sandbox
title: Connection (Sandbox)
description: Connect an Allegro Sandbox test account to this project.
components:
  - component_id: allegro_sandbox_connections
    type: connection_form
    title: Allegro Sandbox accounts
    description: Add your Allegro application once, then connect one or more Sandbox accounts. Flow Steward keeps the authorization, renews it and never shows it again.
    data:
      oauth_provider_id: allegro_sandbox
      connection_type: allegro_sandbox
      oauth_intent: connect
      test_action: test_connection
  - component_id: sandbox_connection_how
    type: markdown
    title: Where to get the Client ID
    body: |
      Open [apps.developer.allegro.pl.allegrosandbox.pl](https://apps.developer.allegro.pl.allegrosandbox.pl), choose your application (or add one, see Setup Guide) and copy its **Client ID** and **Client Secret**. The application's redirect addresses must include the OAuth Redirect URI shown above, exactly as shown.
  - component_id: sandbox_connection_help
    anchor_id: if-it-fails
    type: markdown
    title: If it fails
    body: |
      - **Invalid client** — the Client ID or Client Secret is wrong, or the application was removed. Copy both again from apps.developer.allegro.pl.allegrosandbox.pl.
      - **Redirect URI mismatch** on the Allegro page — add the OAuth Redirect URI shown above to the application, exactly as shown.
      - **Authorization required** — the authorization expired (Allegro keeps it for three months without use) or was withdrawn in Allegro. Press **Connect** again.
      - **A step is refused with HTTP 403** — the application lacks the permission the step names. Add it to the application at apps.developer.allegro.pl.allegrosandbox.pl, then press **Connect** again.
      - **HTTP 429** — Allegro's rate limit is reached. Wait as long as the error says and run the step again.
