page_id: allegro-api-products
title: 'Allegro API: Products and categories'
description: The 33 products and categories steps.
components:
- component_id: steps_products
  type: markdown
  title: Products
  body: |
    ### Get category product parameters

    Use this resource to get the list of product parameters available in given category. You can use these parameters to create a new product. The specification names no Allegro permission for it.

    Action id `get_category_product_parameters` · reads only · Allegro: `GET /sale/categories/{categoryId}/product-parameters`

    Inputs: `category_id` (required), `accept_language`.

    ### Search products

    Use this resource to get a list of products according to provided parameters. At least ean or phrase parameter is required. This resource is limited with Leaky Bucket mechanism,. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `search_products` · reads only · Allegro: `GET /sale/products`

    Inputs: `phrase`, `mode`, `language`, `category_id`, `dynamic_filters`, `page_id`, `search_features`, `accept_language`.

    ### Get product

    Use this resource to retrieve all data of the particular product. This resource is limited with Leaky Bucket mechanism. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_product` · reads only · Allegro: `GET /sale/products/{productId}`

    Inputs: `product_id` (required), `category_id`, `language`, `accept_language`.

    ### Get product change proposal

    Use this resource to retrieve all data of the particular product changes proposal. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_product_change_proposal` · reads only · Allegro: `GET /sale/products/change-proposals/{changeProposalId}`

    Inputs: `change_proposal_id` (required), `accept_language`.

    ### Propose product

    Use this resource to propose a product. You can add up to 20,000 new products to the Catalog each month. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `propose_product` · changes data in Allegro · Allegro: `POST /sale/product-proposals`

    Inputs: `accept_language`, `body` (required).

    ### Propose product changes

    Use this resource to propose changes in product. This resource is limited to 100 suggestions per day for a single user. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `propose_product_changes` · changes data in Allegro · Allegro: `POST /sale/products/{productId}/change-proposals`

    Inputs: `product_id` (required), `accept_language`, `body` (required).
- component_id: steps_categories_and_parameters
  type: markdown
  title: Categories and parameters
  body: |
    ### Get categories

    Use this resource to traverse the Allegro categories tree. It returns the list of the given category's children or a list of the main Allegro categories. The specification names no Allegro permission for it.

    Action id `get_categories` · reads only · Allegro: `GET /sale/categories`

    Inputs: `parent_id`, `accept_language`.

    ### Get category

    Use this resource to get the details of a specific category. The specification names no Allegro permission for it.

    Action id `get_category` · reads only · Allegro: `GET /sale/categories/{categoryId}`

    Inputs: `category_id` (required), `accept_language`.

    ### Get category parameters

    Use this resource to get the list of parameters that are supported by the given category. The specification names no Allegro permission for it.

    Action id `get_category_parameters` · reads only · Allegro: `GET /sale/categories/{categoryId}/parameters`

    Inputs: `category_id` (required), `accept_language`.

    ### Get planned category parameter changes

    Use this resource to get information about planned changes in category parameters. Please note that in some cases, the returned events may finally not happen in the future. At present we support the following changes: - REQUIREMENT_CHANGE - the parameter will be required in the category. The specification names no Allegro permission for it.

    Action id `get_planned_category_parameter_changes` · reads only · Allegro: `GET /sale/category-parameters-scheduled-changes`

    Inputs: `scheduled_for_gte`, `scheduled_for_lte`, `scheduled_at_gte`, `scheduled_at_lte`, `type`, `offset`, `limit`, `accept_language`.

    ### Get category changes

    Use this resource to get information about changes in categories. It returns changes that occurred in the last 3 months. At present we support the following changes: - CATEGORY_CREATED - new category was created. - CATEGORY_RENAMED - category name has been changed. - CATEGORY_MOVED - category has been moved to a different place in category tree, category parent id field is changed. The specification names no Allegro permission for it.

    Action id `get_category_changes` · reads only · Allegro: `GET /sale/category-events`

    Inputs: `from`, `limit`, `type`, `accept_language`.

    ### Suggest categories

    Use this resource to receive suggested categories for given phrase. This resource is rate limited to 5 requests per second. The specification names no Allegro permission for it.

    Action id `suggest_categories` · reads only · Allegro: `GET /sale/matching-categories`

    Inputs: `name` (required), `accept_language`.
- component_id: steps_compatibility_list
  type: markdown
  title: Compatibility List
  body: |
    ### Get compatibility list categories

    Compatibility list is available in particular categories, this resource allows to get the list of these categories with additional details. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_compatibility_list_categories` · reads only · Allegro: `GET /sale/compatibility-list/supported-categories`

    Inputs: `accept_language`.

    ### Get suggested compatibility list

    Resource allows to fetch compatibility list suggestion for given offer or product. The specification names no Allegro permission for it.

    Action id `get_suggested_compatibility_list` · reads only · Allegro: `GET /sale/compatibility-list-suggestions`

    Inputs: `offer_id`, `product_id`, `language`, `accept_language`.

    ### Get compatible product groups

    Compatible products are organized in groups, this resource allows to browse these groups. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_compatible_product_groups` · reads only · Allegro: `GET /sale/compatible-products/groups`

    Inputs: `type` (required), `limit`, `offset`, `if_modified_since`, `accept_language`.

    ### Get compatible products

    Resource allows to fetch compatible products of given type. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_compatible_products` · reads only · Allegro: `GET /sale/compatible-products`

    Inputs: `type` (required), `group_id`, `tecdoc_k_typ_nr`, `tecdoc_n_typ_nr`, `phrase`, `limit`, `offset`, `accept_language`, `if_modified_since`.
- component_id: steps_tax_settings
  type: markdown
  title: Tax settings
  body: |
    ### Get tax settings for category

    Use this resource to receive tax settings for a given leaf category. Based on received settings you may set VAT tax settings for your offers. The specification names no Allegro permission for it.

    Action id `get_tax_settings_for_category` · reads only · Allegro: `GET /sale/tax-settings`

    Inputs: `category_id` (required), `country_code`, `accept_language`.
- component_id: steps_deposits
  type: markdown
  title: Deposits
  body: |
    ### Get deposit types

    Use this resource to get enabled deposit types available when creating an offer. The pricing mode determines whether the deposit has a fixed catalog price (FIXED) or requires a seller-provided price in the configured currency (CUSTOM). Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_deposit_types` · reads only · Allegro: `GET /deposit/types`

    Inputs: `accept_language`.
- component_id: steps_ingredients
  type: markdown
  title: Ingredients
  body: |
    ### Parse product ingredients

    Use this resource to parse raw, free-text ingredients declarations into structured ingredient lists for one or more products. Every submitted product text is parsed independently. The response contains parsed items together with errors and warnings detected for each product. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `parse_product_ingredients` · reads only · Allegro: `POST /ingredients/parse`

    Inputs: `accept_language`, `body` (required).
- component_id: steps_size_tables
  type: markdown
  title: Size tables
  body: |
    ### Get size table

    Use this resource to get selected size table. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_size_table` · reads only · Allegro: `GET /sale/size-tables/{tableId}`

    Inputs: `table_id` (required), `accept_language`.

    ### Get size tables

    Use this resource to get all size tables assigned to a seller account. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_size_tables` · reads only · Allegro: `GET /sale/size-tables`

    Inputs: `accept_language`.

    ### Get size table templates

    Use this resource to get all size tables templates. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_size_table_templates` · reads only · Allegro: `GET /sale/size-tables-templates`

    Inputs: `accept_language`.

    ### Create size table

    Use this resource to create size table. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_size_table` · changes data in Allegro · Allegro: `POST /sale/size-tables`

    Inputs: `accept_language`, `body` (required).

    ### Update size table

    Use this resource to update selected size table. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_size_table` · changes data in Allegro · Allegro: `PUT /sale/size-tables/{tableId}`

    Inputs: `table_id` (required), `accept_language`, `body` (required).
- component_id: steps_responsible_persons
  type: markdown
  title: Responsible persons
  body: |
    ### Get responsible persons

    Use this resource to get a list of responsible persons for the compliance of the product with EU regulations. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_responsible_persons` · reads only · Allegro: `GET /sale/responsible-persons`

    Inputs: `offset`, `limit`, `accept_language`.

    ### Get responsible person

    Use this resource to get a responsible person for the compliance of the product with EU regulations. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_responsible_person` · reads only · Allegro: `GET /sale/responsible-persons/{id}`

    Inputs: `id` (required), `accept_language`.

    ### Create responsible person

    Use this resource to create a new responsible person for the compliance of the product with EU regulations. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_responsible_person` · changes data in Allegro · Allegro: `POST /sale/responsible-persons`

    Inputs: `accept_language`, `body` (required).

    ### Update responsible person

    Use this resource to update the responsible person for the compliance of the product with EU regulations. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_responsible_person` · changes data in Allegro · Allegro: `PUT /sale/responsible-persons/{id}`

    Inputs: `id` (required), `accept_language`, `body` (required).
- component_id: steps_responsible_producers
  type: markdown
  title: Responsible producers
  body: |
    ### Get responsible producers

    Use this resource to get a list of responsible producers for the compliance of the product with EU regulations. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_responsible_producers` · reads only · Allegro: `GET /sale/responsible-producers`

    Inputs: `offset`, `limit`, `accept_language`.

    ### Get responsible producer

    Use this resource to get a responsible producer for the compliance of the product with EU regulations. Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_responsible_producer` · reads only · Allegro: `GET /sale/responsible-producers/{id}`

    Inputs: `id` (required), `accept_language`.

    ### Create responsible producer

    Use this resource to create a new responsible producer for the compliance of the product with EU regulations. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_responsible_producer` · changes data in Allegro · Allegro: `POST /sale/responsible-producers`

    Inputs: `accept_language`, `body` (required).

    ### Update responsible producer

    Use this resource to update the responsible producer for the compliance of the product with EU regulations. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_responsible_producer` · changes data in Allegro · Allegro: `PUT /sale/responsible-producers/{id}`

    Inputs: `id` (required), `accept_language`, `body` (required).

    ### Delete responsible producer

    Use this resource to delete a responsible producer created by you. The responsible producer can be deleted only if it is not assigned to any offer, otherwise the request is rejected and the responsible producer is not deleted. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `delete_responsible_producer` · changes data in Allegro · Allegro: `DELETE /sale/responsible-producers/{id}`

    Inputs: `id` (required), `accept_language`.
