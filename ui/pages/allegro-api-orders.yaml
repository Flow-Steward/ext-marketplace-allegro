page_id: allegro-api-orders
title: 'Allegro API: Orders and returns'
description: The 46 orders and returns steps.
components:
- component_id: steps_order_management
  type: markdown
  title: Order management
  body: |
    ### Get order events page

    Use this resource to return events that allow you to monitor actions which clients perform, i.e. making a purchase, filling in the checkout form (FOD), finishing payment process, making a surcharge. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_order_events_page` · reads only · Allegro: `GET /order/events`

    Inputs: `from`, `type`, `limit`, `accept_language`.

    ### Get order event statistics

    Use this resource to returns object that contains event id and occurrence date of the latest event. It gives you current starting point for reading events. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_order_event_statistics` · reads only · Allegro: `GET /order/event-stats`

    Inputs: `accept_language`.

    ### Get orders page

    Use this resource to get an order list. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_orders_page` · reads only · Allegro: `GET /order/checkout-forms`

    Inputs: `offset`, `limit`, `status`, `fulfillment_status`, `fulfillment_provider_id`, `fulfillment_shipment_summary_line_items_sent`, `line_items_bought_at_lte`, `line_items_bought_at_gte`, `payment_id`, `surcharges_id`, `delivery_method_id`, `buyer_login`, `marketplace_id`, `updated_at_lte`, `updated_at_gte`, `sort`, `accept_language`.

    ### Get order

    Use this resource to get an order details. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_order` · reads only · Allegro: `GET /order/checkout-forms/{id}`

    Inputs: `id` (required), `accept_language`.

    ### Get shipping carriers

    Shipping carriers are essential to provide accurate tracking experience for customers. Use this resource to get a list of all available shipping carriers. This resource is rate limited to 50 requests per second. The response of this resource can be stored in accordance with returned caching headers. The specification names no Allegro permission for it.

    Action id `get_shipping_carriers` · reads only · Allegro: `GET /order/carriers`

    Inputs: `accept_language`.

    ### Get order tracking numbers

    Get a list of parcel tracking numbers currently assigned to the order. Orders can be retrieved using REST API resource GET /order/checkout-forms. Please note that the shipment list may contain parcel tracking numbers added through other channels such as Moje Allegro or by the carrier that delivers the parcel. This resource is rate limited to 50 requests per second. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_order_tracking_numbers` · reads only · Allegro: `GET /order/checkout-forms/{id}/shipments`

    Inputs: `id` (required), `accept_language`.

    ### Get order invoices

    Use to get invoices details including antivirus scan results and EPT invoice verification status. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_order_invoices` · reads only · Allegro: `GET /order/checkout-forms/{id}/invoices`

    Inputs: `id` (required), `accept_language`.

    ### Get Allegro pickup and drop-off points

    Get a list of Allegro pickup drop off points. The specification names no Allegro permission for it.

    Action id `get_allegro_pickup_and_drop_off_points` · reads only · Allegro: `GET /order/carriers/ALLEGRO/points`

    Inputs: `carriers`, `if_modified_since`, `accept_language`.

    ### Get parcel tracking history

    Get tracking history for parcels. The specification names no Allegro permission for it.

    Action id `get_parcel_tracking_history` · reads only · Allegro: `GET /order/carriers/{carrierId}/tracking`

    Inputs: `carrier_id` (required), `waybill` (required), `accept_language`.

    ### Add order tracking number

    Add a parcel tracking number (shipment) to given order line items. This resource is rate limited to 50 requests per second. Needs the Allegro permission allegro:api:orders:write.

    Action id `add_order_tracking_number` · changes data in Allegro · Allegro: `POST /order/checkout-forms/{id}/shipments`

    Inputs: `id` (required), `accept_language`, `body` (required).

    ### Set order serial numbers

    Use to set serial numbers in the given line items of seller order. Needs the Allegro permission allegro:api:orders:write.

    Action id `set_order_serial_numbers` · changes data in Allegro · Allegro: `POST /order/checkout-forms/{id}/serial-numbers`

    Inputs: `id` (required), `checkout_form_revision`, `accept_language`, `body`.

    ### Add order invoice

    Use to add new invoice metadata. Before you send an invoice file, you need to initialize the invoice instance with the required parameters. Allegro marks this operation as deprecated. Needs the Allegro permission allegro:api:orders:write.

    Action id `add_order_invoice` · changes data in Allegro · Allegro: `POST /order/checkout-forms/{id}/invoices`

    Inputs: `id` (required), `accept_language`, `body` (required).

    ### Upload order invoice with details

    Use to add an invoice to the order in a single request - the invoice file together with its metadata are sent together, instead of the two-step flow (add invoice metadata, then upload invoice file). Needs the Allegro permission allegro:api:orders:write.

    Action id `upload_order_invoice_with_details` · changes data in Allegro · Allegro: `POST /order/{orderId}/billing-documents/files`

    Inputs: `order_id` (required), `accept_language`, `file` (required), `invoice_number`.

    ### Add order billing document link

    Used to upload a URL to a billing document. You can add up to 10 links. Needs the Allegro permission allegro:api:orders:write.

    Action id `add_order_billing_document_link` · changes data in Allegro · Allegro: `POST /order/{orderId}/billing-documents/links`

    Inputs: `order_id` (required), `accept_language`, `body`.

    ### Set order status

    Use to set seller order status. Needs the Allegro permission allegro:api:orders:write.

    Action id `set_order_status` · changes data in Allegro · Allegro: `PUT /order/checkout-forms/{id}/fulfillment`

    Inputs: `id` (required), `checkout_form_revision`, `accept_language`, `body` (required).

    ### Upload order invoice file

    Use to upload invoice file to match created invoice metadata. Allegro marks this operation as deprecated. Needs the Allegro permission allegro:api:orders:write.

    Action id `upload_order_invoice_file` · changes data in Allegro · Allegro: `PUT /order/checkout-forms/{id}/invoices/{invoiceId}/file`

    Inputs: `id` (required), `invoice_id` (required), `accept_language`, `file`, `content_type`.
- component_id: steps_customer_returns
  type: markdown
  title: Customer returns
  body: |
    ### Get customer returns

    Use this resource to get all customer returns filtered by query parameters. This resource is limited to 25 requests per second for a single user and 50 requests per second for clientId. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_customer_returns` · reads only · Allegro: `GET /order/customer-returns`

    Inputs: `customer_return_id`, `order_id`, `buyer_email`, `buyer_login`, `items_offer_id`, `items_name`, `parcels_waybill`, `parcels_transporting_waybill`, `parcels_carrier_id`, `parcels_transporting_carrier_id`, `parcels_sender_phone_number`, `reference_number`, `from`, `created_at_gte`, `created_at_lte`, `updated_at_gte`, `updated_at_lte`, `marketplace_id`, `status`, `limit`, `offset`, `accept_language`.

    ### Get customer return

    Use this resource to get customer returns by its identifier. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_customer_return` · reads only · Allegro: `GET /order/customer-returns/{customerReturnId}`

    Inputs: `customer_return_id` (required), `accept_language`.

    ### Download customer return form

    Use this resource to download a PDF document containing details of a customer return. If buyer data is unavailable, the document is generated without it. The answer is saved as a workflow file. Needs the Allegro permission allegro:api:orders:read.

    Action id `download_customer_return_form` · reads only · Allegro: `GET /order/customer-returns/{customerReturnId}/files`

    Inputs: `customer_return_id` (required), `accept_language`.

    ### Reject customer return refund

    Use this resource to reject customer return refund with provided reason. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:orders:write.

    Action id `reject_customer_return_refund` · changes data in Allegro · Allegro: `POST /order/customer-returns/{customerReturnId}/rejection`

    Inputs: `customer_return_id` (required), `accept_language`, `body` (required).
- component_id: steps_post_purchase_issues
  type: markdown
  title: Post Purchase Issues
  body: |
    ### Get disputes and claims

    Use this resource to get the list of your disputes and claims ordered by descending opened date. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:disputes.

    Action id `get_disputes_and_claims` · reads only · Allegro: `GET /sale/issues`

    Inputs: `checkout_form_id`, `limit`, `offset`, `status`, `accept_language`.

    ### Get dispute or claim

    Use this resource to get a single dispute or claim. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:disputes.

    Action id `get_dispute_or_claim` · reads only · Allegro: `GET /sale/issues/{issueId}`

    Inputs: `issue_id` (required), `accept_language`.

    ### Get dispute or claim messages

    Use this resource to get the list of messages and state changes within a dispute or claim. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:disputes.

    Action id `get_dispute_or_claim_messages` · reads only · Allegro: `GET /sale/issues/{issueId}/chat`

    Inputs: `issue_id` (required), `limit`, `offset`, `accept_language`.

    ### Download dispute attachment

    Use this resource to get an attachment. The answer is saved as a workflow file. Needs the Allegro permission allegro:api:disputes.

    Action id `download_dispute_attachment` · reads only · Allegro: `GET /sale/issues/attachments/{attachmentId}`

    Inputs: `attachment_id` (required), `accept_language`.

    ### Send message in dispute or claim

    Use this resource to post a message in certain issue. At least one of fields: 'text', 'attachment' has to be present. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:disputes.

    Action id `send_message_in_dispute_or_claim` · changes data in Allegro · Allegro: `POST /sale/issues/{issueId}/message`

    Inputs: `issue_id` (required), `accept_language`, `body` (required).

    ### Change claim status

    Change the formal status of a claim, for example accept or reject it. Not a valid operation for disputes. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:disputes.

    Action id `change_claim_status` · changes data in Allegro · Allegro: `POST /sale/issues/{issueId}/status`

    Inputs: `issue_id` (required), `accept_language`, `body` (required).

    ### Create dispute attachment

    Use this resource to post an attachment declaration. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:disputes.

    Action id `create_dispute_attachment` · changes data in Allegro · Allegro: `POST /sale/issues/attachments`

    Inputs: `accept_language`, `body` (required).

    ### Upload dispute attachment file

    Upload a post purchase issue message attachment. This operation should be used after creating an attachment declaration with *POST /sale/issues/attachments* Important! You can find the URL address to upload the file to our server in the *Location* response header of *POST /sale/issues/attachments*. The URL is unique and one-time. As its format may change in time, you should always use the address from the header. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:disputes.

    Action id `upload_dispute_attachment_file` · changes data in Allegro · Allegro: `PUT /sale/issues/attachments/{attachmentId}`

    Inputs: `attachment_id` (required), `accept_language`, `file` (required), `content_type`.
- component_id: steps_commission_refunds
  type: markdown
  title: Commission refunds
  body: |
    ### Get commission refund application

    Use this resource to get refund application details. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_commission_refund_application` · reads only · Allegro: `GET /order/refund-claims/{claimId}`

    Inputs: `claim_id` (required), `accept_language`.

    ### Get commission refund applications

    Use this resource to get a list of refund applications based on the provided query parameters. Needs the Allegro permission allegro:api:orders:read.

    Action id `get_commission_refund_applications` · reads only · Allegro: `GET /order/refund-claims`

    Inputs: `line_item_offer_id`, `buyer_id`, `status`, `limit`, `offset`, `accept_language`.

    ### Apply for commission refund

    Use this resource to create a refund application. Needs the Allegro permission allegro:api:orders:write.

    Action id `apply_for_commission_refund` · changes data in Allegro · Allegro: `POST /order/refund-claims`

    Inputs: `accept_language`, `body` (required).

    ### Cancel commission refund application

    Use this resource to cancel a refund application. This cannot be undone. Needs the Allegro permission allegro:api:orders:write.

    Action id `cancel_commission_refund_application` · changes data in Allegro · Allegro: `DELETE /order/refund-claims/{claimId}`

    Inputs: `claim_id` (required), `accept_language`.
- component_id: steps_payments
  type: markdown
  title: Payments
  body: |
    ### Get payment operations

    Use this endpoint to get the list of the seller payment operations. Needs the Allegro permission allegro:api:payments:read.

    Action id `get_payment_operations` · reads only · Allegro: `GET /payments/payment-operations`

    Inputs: `wallet_type`, `wallet_payment_operator`, `payment_id`, `participant_login`, `occurred_at_gte`, `occurred_at_lte`, `group`, `marketplace_id`, `currency`, `limit`, `offset`, `accept_language`.

    ### Get payment refunds

    Get a list of refunded payments. Needs the Allegro permission allegro:api:payments:read.

    Action id `get_payment_refunds` · reads only · Allegro: `GET /payments/refunds`

    Inputs: `limit`, `offset`, `id`, `payment_id`, `order_id`, `occurred_at_gte`, `occurred_at_lte`, `status`, `accept_language`.

    ### Refund payment

    Use this endpoint to initiate a refund of a payment. Needs the Allegro permission allegro:api:payments:write.

    Action id `refund_payment` · changes data in Allegro · Allegro: `POST /payments/refunds`

    Inputs: `accept_language`, `body`.
- component_id: steps_message_center
  type: markdown
  title: Message Center
  body: |
    ### Get message threads

    Use this resource to get the list of user threads sorted by last message date, starting from newest. Needs the Allegro permission allegro:api:messaging.

    Action id `get_message_threads` · reads only · Allegro: `GET /messaging/threads`

    Inputs: `limit`, `offset`, `page_id`, `read`, `status`, `type`, `order_id`, `accept_language`.

    ### Get message thread

    Use this resource to get thread with provided identifier. Needs the Allegro permission allegro:api:messaging.

    Action id `get_message_thread` · reads only · Allegro: `GET /messaging/threads/{threadId}`

    Inputs: `thread_id` (required), `accept_language`.

    ### Get messages in thread

    Use this resource to list messages in thread with provided identifier. Needs the Allegro permission allegro:api:messaging.

    Action id `get_messages_in_thread` · reads only · Allegro: `GET /messaging/threads/{threadId}/messages`

    Inputs: `thread_id` (required), `limit`, `offset`, `before`, `after`, `page_id`, `accept_language`.

    ### Get message

    Use this resource to get message with provided identifier. Needs the Allegro permission allegro:api:messaging.

    Action id `get_message` · reads only · Allegro: `GET /messaging/messages/{messageId}`

    Inputs: `message_id` (required), `accept_language`.

    ### Download message attachment

    Use this resource to download attachment with provided identifier. You can retrieve attachments uploaded within the last 6 months. The answer is saved as a workflow file. Needs the Allegro permission allegro:api:messaging.

    Action id `download_message_attachment` · reads only · Allegro: `GET /messaging/message-attachments/{attachmentId}`

    Inputs: `attachment_id` (required), `accept_language`.

    ### Write message

    Use this resource to write new message to recipient. This resource is rate limited to 1 request per second for a user. Needs the Allegro permission allegro:api:messaging.

    Action id `write_message` · changes data in Allegro · Allegro: `POST /messaging/messages`

    Inputs: `accept_language`, `body` (required).

    ### Write message in thread

    Use this resource to write new message in existing thread. This resource is rate limited to 1 request per second for a user. Needs the Allegro permission allegro:api:messaging.

    Action id `write_message_in_thread` · changes data in Allegro · Allegro: `POST /messaging/threads/{threadId}/messages`

    Inputs: `thread_id` (required), `accept_language`, `body` (required).

    ### Create message attachment

    Use this resource to add attachment declaration before uploading. Needs the Allegro permission allegro:api:messaging.

    Action id `create_message_attachment` · changes data in Allegro · Allegro: `POST /messaging/message-attachments`

    Inputs: `accept_language`, `body` (required).

    ### Mark message thread as read

    Use this resource to mark thread with provided identifier as read. Needs the Allegro permission allegro:api:messaging.

    Action id `mark_message_thread_as_read` · changes data in Allegro · Allegro: `PUT /messaging/threads/{threadId}/read`

    Inputs: `thread_id` (required), `accept_language`, `body` (required).

    ### Upload message attachment file

    Use this resource to upload attachment using identifier that was declared. Needs the Allegro permission allegro:api:messaging.

    Action id `upload_message_attachment_file` · changes data in Allegro · Allegro: `PUT /messaging/message-attachments/{attachmentId}`

    Inputs: `attachment_id` (required), `accept_language`, `file` (required), `content_type`.

    ### Delete message

    Use this resource to delete message with provided identifier. This resource is deprecated and will be removed in the future. Allegro marks this operation as deprecated. Needs the Allegro permission allegro:api:messaging.

    Action id `delete_message` · changes data in Allegro · Allegro: `DELETE /messaging/messages/{messageId}`

    Inputs: `message_id` (required), `accept_language`.
