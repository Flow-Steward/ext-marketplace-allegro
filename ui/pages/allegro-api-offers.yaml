page_id: allegro-api-offers
title: 'Allegro API: Offers'
description: The 58 offers steps.
components:
- component_id: steps_offer_management
  type: markdown
  title: Offer management
  body: |
    ### Check offer processing status

    The URI for the resource given by Location header of POST /sale/product-offers and PATCH /sale/product-offers/{offerId}. Use this resource to check processing status of a POST or PATCH request. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `check_offer_processing_status` · reads only · Allegro: `GET /sale/product-offers/{offerId}/operations/{operationId}`

    Inputs: `offer_id` (required), `operation_id` (required), `accept_language`.

    ### Get publication command summary

    Use this resource to retrieve information about the offer listing statuses. You will receive a summary with a number of correctly listed offers and errors. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_publication_command_summary` · reads only · Allegro: `GET /sale/offer-publication-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get publication command report

    Use this resource to retrieve information about the offer statuses on the site (Defaults: limit = 100, offset = 0). This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_publication_command_report` · reads only · Allegro: `GET /sale/offer-publication-commands/{commandId}/tasks`

    Inputs: `command_id` (required), `limit`, `offset`, `accept_language`.

    ### Get promotion packages

    Use this resource to retrieve all available offer promotion packages. The specification names no Allegro permission for it.

    Action id `get_promotion_packages` · reads only · Allegro: `GET /sale/offer-promotion-packages`

    Inputs: `accept_language`.

    ### Get promotion packages of offer

    Use this resource to get promotion packages assigned to an offer. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_promotion_packages_of_offer` · reads only · Allegro: `GET /sale/offers/{offerId}/promo-options`

    Inputs: `offer_id` (required), `accept_language`.

    ### Get promotion packages of my offers

    Use this resource to retrieve promo options for seller offers. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_promotion_packages_of_my_offers` · reads only · Allegro: `GET /sale/offers/promo-options`

    Inputs: `limit`, `offset`, `accept_language`.

    ### Get promotion package command summary

    Use this resource to find out how many offers were edited within one {commandId}. You will receive a summary with a number of successfully edited offers and errors. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_promotion_package_command_summary` · reads only · Allegro: `GET /sale/offers/promo-options-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get promotion package command report

    Use this resource to retrieve the result of an offer modification command. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_promotion_package_command_report` · reads only · Allegro: `GET /sale/offers/promo-options-commands/{commandId}/tasks`

    Inputs: `command_id` (required), `limit`, `offset`, `accept_language`.

    ### Get offers with missing parameters

    Use this resource to get information about required parameters or parameters scheduled to become required that are not filled in offers. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offers_with_missing_parameters` · reads only · Allegro: `GET /sale/offers/unfilled-parameters`

    Inputs: `offer_id`, `parameter_type`, `offset`, `limit`, `accept_language`.

    ### Create offer from product

    Use this resource to create offer based on product. Note that requests may be limited. When Allegro answers HTTP 202 it has accepted the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Check offer processing status. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `create_offer_from_product` · changes data in Allegro · Allegro: `POST /sale/product-offers`

    Inputs: `accept_language`, `body` (required).

    ### Change promotion packages of offer

    Use this resource to modify offer promotion packages. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `change_promotion_packages_of_offer` · changes data in Allegro · Allegro: `POST /sale/offers/{offerId}/promo-options-modification`

    Inputs: `offer_id` (required), `accept_language`, `body` (required).

    ### Change Buy Now price of offer

    Use this resource to change the Buy Now price in a single offer. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome from Allegro afterwards. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `change_buy_now_price_of_offer` · changes data in Allegro · Allegro: `PUT /offers/{offerId}/change-price-commands/{commandId}`

    Inputs: `offer_id` (required), `command_id` (required), `accept_language`, `body` (required).

    ### Publish or end offers

    Use this resource to modify multiple offers publication at once. This resource is rate limited to 250 000 offer changes per hour or 9000 offer changes per minute. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get publication command summary. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `publish_or_end_offers` · changes data in Allegro · Allegro: `PUT /sale/offer-publication-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`, `body` (required).

    ### Change promotion packages of many offers

    Use this resource to modify promotion packages on multiple offers at once. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get promotion package command summary. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `change_promotion_packages_of_many_offers` · changes data in Allegro · Allegro: `PUT /sale/offers/promo-options-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`, `body` (required).

    ### Edit offer

    Use this resource to edit an offer. This resource allows you to edit each field independently, so you can update a single field, such as the price or quantity, several fields, or all supported offer fields in a single request. In general, fields omitted from the request remain unchanged. The request follows RFC 7396: arrays are replaced as a whole, and setting a field to null removes it. When Allegro answers HTTP 202 it has accepted the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Check offer processing status. The specification names no Allegro permission for it.

    Action id `edit_offer` · changes data in Allegro · Allegro: `PATCH /sale/product-offers/{offerId}`

    Inputs: `offer_id` (required), `accept_language`, `body` (required).

    ### Delete draft offer

    Use this resource to delete a draft offer. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `delete_draft_offer` · changes data in Allegro · Allegro: `DELETE /sale/offers/{offerId}`

    Inputs: `offer_id` (required), `accept_language`.
- component_id: steps_user_s_offer_information
  type: markdown
  title: User's offer information
  body: |
    ### Get offer

    Use this resource to retrieve all data of the particular product-offer. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offer` · reads only · Allegro: `GET /sale/product-offers/{offerId}`

    Inputs: `offer_id` (required), `accept_language`.

    ### Get offer parts

    Use this resource to retrieve selected data of the particular product-offer. The model and functionality is a subset of the full product offer get endpoint (GET /sale/product-offers/{offerId}), but it is faster and more reliable. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offer_parts` · reads only · Allegro: `GET /sale/product-offers/{offerId}/parts`

    Inputs: `offer_id` (required), `include` (required), `accept_language`.

    ### Get offers page

    Use this resource to get the list of the seller's offers. You can use different query parameters to filter the list. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offers_page` · reads only · Allegro: `GET /sale/offers`

    Inputs: `offer_id`, `name`, `selling_mode_price_amount_gte`, `selling_mode_price_amount_lte`, `selling_mode_price_automation_rule_id`, `selling_mode_price_automation_rule_id_empty`, `publication_status`, `publication_marketplace`, `selling_mode_format`, `external_id`, `delivery_shipping_rates_id`, `delivery_shipping_rates_id_empty`, `sort`, `limit`, `offset`, `category_id`, `product_id_empty`, `productization_required`, `b2b_buyable_only_by_business`, `fundraising_campaign_id`, `fundraising_campaign_id_empty`, `after_sales_services_return_policy_id`, `is_fulfillment`, `accept_language`.

    ### Get Smart! report of offer

    Use this resource to get a full Smart! offer classification report of one of your offers. Please keep in mind you have to meet Smart! seller conditions first - for more details, use *GET /sale/smart*. To learn more about Smart! offer requirements, see our knowledge base article:. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_smart_report_of_offer` · reads only · Allegro: `GET /sale/offers/{offerId}/smart`

    Inputs: `offer_id` (required), `marketplace_id`, `accept_language`.

    ### Get offer events

    Use this endpoint to get events from the last 24 hours concerning changes in the authorized seller's offers. At present we support the following events: - OFFER_ACTIVATED - offer is visible on site and available for purchase, occurs when offer status changes from ACTIVATING to ACTIVE. - OFFER_CHANGED - occurs when offer's fields have been changed e.g. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offer_events` · reads only · Allegro: `GET /sale/offer-events`

    Inputs: `from`, `limit`, `type`, `accept_language`.
- component_id: steps_batch_offer_modification
  type: markdown
  title: Batch offer modification
  body: |
    ### Get offer modification command summary

    Use this resource to find out how many offers were edited within one {commandId}. You will receive a summary with a number of successfully edited offers. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_offer_modification_command_summary` · reads only · Allegro: `GET /sale/offer-modification-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get offer modification command report

    Use this resource to retrieve a detailed summary of changes introduced within one {commandId} (defaults: limit = 100, offset = 0). This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_offer_modification_command_report` · reads only · Allegro: `GET /sale/offer-modification-commands/{commandId}/tasks`

    Inputs: `command_id` (required), `limit`, `offset`, `accept_language`.

    ### Get price change command summary

    Returns status and summary of particular command execution. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_price_change_command_summary` · reads only · Allegro: `GET /sale/offer-price-change-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get price change command report

    Defaults: limit = 100, offset = 0. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_price_change_command_report` · reads only · Allegro: `GET /sale/offer-price-change-commands/{commandId}/tasks`

    Inputs: `command_id` (required), `limit`, `offset`, `accept_language`.

    ### Get price and stock command summary (beta)

    Returns status and summary of particular command execution. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_price_and_stock_command_summary_beta` · reads only · Allegro: `GET /sale/offer-bulk-modification-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get price and stock command report (beta)

    Defaults: limit = 100, offset = 0. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_price_and_stock_command_report_beta` · reads only · Allegro: `GET /sale/offer-bulk-modification-commands/{commandId}/tasks`

    Inputs: `command_id` (required), `limit`, `offset`, `accept_language`.

    ### Get stock change command summary

    Returns status and summary of the command. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_stock_change_command_summary` · reads only · Allegro: `GET /sale/offer-quantity-change-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get stock change command report

    Defaults: limit = 100, offset = 0. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `get_stock_change_command_report` · reads only · Allegro: `GET /sale/offer-quantity-change-commands/{commandId}/tasks`

    Inputs: `command_id` (required), `limit`, `offset`, `accept_language`.

    ### Get automatic pricing command summary

    Returns status and summary of the offer-price-automation-command. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_automatic_pricing_command_summary` · reads only · Allegro: `GET /sale/offer-price-automation-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get automatic pricing command report

    Defaults: limit = 100, offset = 0. Returns status and report of the offer-price-automation-command. This resource is rate limited to retrieving information about 270 000 offer changes per minute. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_automatic_pricing_command_report` · reads only · Allegro: `GET /sale/offer-price-automation-commands/{commandId}/tasks`

    Inputs: `command_id` (required), `limit`, `offset`, `accept_language`.

    ### Change prices and stock of many offers (beta)

    Bulk price and stock modification. Contrary to standard batch price or stock modification, it lets you modify both price and stock modification across multiple offers, or within the same offer but in a separate modification unit. Change price and stock of offers. This resource is rate limited to 150 000 offer changes per hour or 9000 offer changes per minute - limit applies to a single user of the application. Beta in Allegro: it may still change. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get price and stock command summary (beta). Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `change_prices_and_stock_of_many_offers_beta` · changes data in Allegro · Allegro: `POST /sale/offer-bulk-modification-commands`

    Inputs: `accept_language`, `body` (required).

    ### Change automatic pricing of many offers

    Use this resource to modify the automatic pricing rules of multiple offers at the same time. This resource is rate limited to 150 000 offer changes per hour or 9000 offer changes per minute - limit applies to a single user of the application. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get automatic pricing command summary. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `change_automatic_pricing_of_many_offers` · changes data in Allegro · Allegro: `POST /sale/offer-price-automation-commands`

    Inputs: `accept_language`, `body` (required).

    ### Modify many offers

    Use this resource to modify multiple offers at once. This resource is rate limited to 250 000 offer changes per hour or 9000 offer changes per minute - limit applies to a single user of the application. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get offer modification command summary. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `modify_many_offers` · changes data in Allegro · Allegro: `PUT /sale/offer-modification-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`, `body` (required).

    ### Change price of many offers

    Change price of offers. This resource is rate limited to 150 000 offer changes per hour or 9000 offer changes per minute - limit applies to a single user of the application. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get price change command summary. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `change_price_of_many_offers` · changes data in Allegro · Allegro: `PUT /sale/offer-price-change-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`, `body` (required).

    ### Change stock of many offers

    Change quantity of multiple offers. This resource is rate limited to 250 000 offer changes per hour or 9000 offer changes per minute - limit applies to a single user of the application. Allegro registers the request and applies it afterwards: the step returns processing "accepted" and applied false. Get the outcome with Get stock change command summary. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `change_stock_of_many_offers` · changes data in Allegro · Allegro: `PUT /sale/offer-quantity-change-commands/{commandId}`

    Inputs: `command_id` (required), `accept_language`, `body` (required).
- component_id: steps_offer_translations
  type: markdown
  title: Offer translations
  body: |
    ### Get offer translations

    Get offer translation for given language or all present. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offer_translations` · reads only · Allegro: `GET /sale/offers/{offerId}/translations`

    Inputs: `offer_id` (required), `language`, `accept_language`.

    ### Update offer translation

    Update manual translation for offer. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `update_offer_translation` · changes data in Allegro · Allegro: `PATCH /sale/offers/{offerId}/translations/{language}`

    Inputs: `language` (required), `offer_id` (required), `accept_language`, `body` (required).

    ### Delete offer translation

    Delete single element or entire manual translation. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `delete_offer_translation` · changes data in Allegro · Allegro: `DELETE /sale/offers/{offerId}/translations/{language}`

    Inputs: `language` (required), `offer_id` (required), `element`, `products_id`, `accept_language`.
- component_id: steps_offer_tags
  type: markdown
  title: Offer tags
  body: |
    ### Get offer tags

    Use this resource to get a list of tags defined by the specified user (Defaults: limit = 1000, offset = 0). Needs the Allegro permission allegro:api:sale:settings:read.

    Action id `get_offer_tags` · reads only · Allegro: `GET /sale/offer-tags`

    Inputs: `limit`, `offset`, `accept_language`.

    ### Get tags of offer

    Use this resource to get a list of tags assigned to offer. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_tags_of_offer` · reads only · Allegro: `GET /sale/offers/{offerId}/tags`

    Inputs: `offer_id` (required), `accept_language`.

    ### Create offer tag

    Use this resource to create a new tag. You can create up to 100 tags. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `create_offer_tag` · changes data in Allegro · Allegro: `POST /sale/offer-tags`

    Inputs: `accept_language`, `body` (required).

    ### Assign tags to offer

    Use this resource to assign a tag to offer. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `assign_tags_to_offer` · changes data in Allegro · Allegro: `POST /sale/offers/{offerId}/tags`

    Inputs: `offer_id` (required), `accept_language`, `body` (required).

    ### Update offer tag

    Use this resource to update a tag. This resource is rate limited to 1 million changes per hour. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `update_offer_tag` · changes data in Allegro · Allegro: `PUT /sale/offer-tags/{tagId}`

    Inputs: `tag_id` (required), `accept_language`, `body` (required).

    ### Delete offer tag

    Use this resource to delete the tag. Needs the Allegro permission allegro:api:sale:settings:write.

    Action id `delete_offer_tag` · changes data in Allegro · Allegro: `DELETE /sale/offer-tags/{tagId}`

    Inputs: `tag_id` (required), `accept_language`.
- component_id: steps_offer_rating
  type: markdown
  title: Offer rating
  body: |
    ### Get offer rating

    Use this resource to get offer rating. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offer_rating` · reads only · Allegro: `GET /sale/offers/{offerId}/rating`

    Inputs: `offer_id` (required), `accept_language`.
- component_id: steps_images_and_attachments
  type: markdown
  title: Images and attachments
  body: |
    ### Get offer attachment

    Get details of an offer attachments, including download link, by attachment identifier ("attachmentId"). The attachment id can be retrieved by querying a particular offer, for example by using GET /sale/product-offers/{offerId}. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_offer_attachment` · reads only · Allegro: `GET /sale/offer-attachments/{attachmentId}`

    Inputs: `attachment_id` (required), `accept_language`.

    ### Upload offer image

    Upload image to our servers. You can choose from two upload options: provide a link and we will download an image for you send an image as binary data Important! Remember to use dedicated domain for upload, i.e. https://upload.allegro.pl for Production https://upload.allegro.pl.allegrosandbox.pl for Sandbox. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `upload_offer_image` · changes data in Allegro · Allegro: `POST /sale/images`

    Inputs: `is_ai_co_created`, `accept_language`, `body`, `file`, `content_type`.

    ### Create offer attachment

    You can attach pdf, jpeg or png files to your offers. We will present them under the offer description in the Additional information section. You can attach multiple files to one offer – one per each type from the list: Guide (MANUAL). Allowed media types: PDF Special offer terms (SPECIAL_OFFER_RULES). Allowed media types: PDF Competition terms (COMPETITION_RULES). Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `create_offer_attachment` · changes data in Allegro · Allegro: `POST /sale/offer-attachments`

    Inputs: `accept_language`, `body` (required).

    ### Upload offer attachment file

    Upload an offer attachment. This operation should be used after creating an offer attachment with *POST /sale/offer-attachments* Important! You can find the URL address to upload the file to our server in the *Location* response header of *POST /sale/offer-attachments*. The URL is unique and one-time. As its format may change in time, you should always use the address from the header. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `upload_offer_attachment_file` · changes data in Allegro · Allegro: `PUT /sale/offer-attachments/{attachmentId}`

    Inputs: `attachment_id` (required), `accept_language`, `file`, `content_type`.
- component_id: steps_classifieds
  type: markdown
  title: Classifieds
  body: |
    ### Get seller's classified ads statistics

    This endpoint returns daily statistics collected for a list of advertisements in a given date range for logged user. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_seller_classified_ads_statistics` · reads only · Allegro: `GET /sale/classified-seller-stats`

    Inputs: `date_gte`, `date_lte`, `accept_language`.

    ### Get classified ads statistics

    This endpoint returns daily statistics collected for a list of advertisements in a given date range. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_classified_ads_statistics` · reads only · Allegro: `GET /sale/classified-offers-stats`

    Inputs: `offer_id` (required), `date_gte`, `date_lte`, `accept_language`.

    ### Get classified packages of offer

    Use this resource to retrieve classified packages currently assigned to an offer. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_classified_packages_of_offer` · reads only · Allegro: `GET /sale/offer-classifieds-packages/{offerId}`

    Inputs: `offer_id` (required), `accept_language`.

    ### Get classified package configurations

    Use this resource to retrieve configurations of classifieds packages for a category. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_classified_package_configurations` · reads only · Allegro: `GET /sale/classifieds-packages`

    Inputs: `category_id` (required), `accept_language`.

    ### Get classified package configuration

    Use this resource to retrieve the configuration of a classifieds package. Needs the Allegro permission allegro:api:sale:offers:read.

    Action id `get_classified_package_configuration` · reads only · Allegro: `GET /sale/classifieds-packages/{packageId}`

    Inputs: `package_id` (required), `accept_language`.

    ### Assign packages to classified

    Use this resource to assign classified packages to an offer. Needs the Allegro permission allegro:api:sale:offers:write.

    Action id `assign_packages_to_classified` · changes data in Allegro · Allegro: `PUT /sale/offer-classifieds-packages/{offerId}`

    Inputs: `offer_id` (required), `accept_language`, `body` (required).
- component_id: steps_auctions_and_bidding
  type: markdown
  title: Auctions and Bidding
  body: |
    ### Get my bid

    Use this resource to retrieve current user's bid information. Needs the Allegro permission allegro:api:bids.

    Action id `get_my_bid` · reads only · Allegro: `GET /bidding/offers/{offerId}/bid`

    Inputs: `offer_id` (required), `accept_language`.

    ### Place bid

    Use this resource to place a bid in an auction. Needs the Allegro permission allegro:api:bids.

    Action id `place_bid` · changes data in Allegro · Allegro: `PUT /bidding/offers/{offerId}/bid`

    Inputs: `offer_id` (required), `accept_language`, `body`.
