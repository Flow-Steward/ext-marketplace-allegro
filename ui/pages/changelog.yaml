- component_id: changelog_entries
  type: markdown
  title: Release history
  body: |
    ## 0.1.1 — 2026-11-19

    - Every step that changes data returns `processing`: `completed` when Allegro answered that the change is made, `accepted` when Allegro answered HTTP 202 or only registered a command (batch offer changes, price, stock, publication and promotion commands, Allegro Prices and AlleDiscount commands, shipment and pickup commands, tracking numbers, badges). With `accepted`, `applied` is false and `check` names the step that reads the outcome and the address Allegro returned. Update stock and prices returns the same.
    - An answer with a success status the specification does not document for the operation is no longer taken as success: a read fails with `invalid_response`; a change fails with `invalid_response` and an unknown outcome, to be checked in Allegro.
    - Numbers: a request number with more than 40 digits or an exponent outside −30…+30 is refused before anything is sent; such a number in Allegro's answer is kept as text in Allegro's own notation, so a confirmed change is never lost to it.
    - Six operations that Allegro documents as retrieving, calculating, querying or parsing are now reads: Download shipment labels, Download shipment protocol, Get pickup proposals, Calculate offer fee and commission, Query Allegro Prices status of offers and Parse product ingredients. Test runs send them, and a label or protocol download saves its file.
    - Get fulfillment stock takes `format`: `json` (default, as before) or `csv`, which saves Allegro's CSV as a workflow file; `limit`, `offset`, `sort` and `product_id` do not apply with `csv`.
    - A batch only partly registered by Update stock and prices: when Allegro certainly refuses a command after earlier ones were registered, or the time runs out before the next one is sent, the step succeeds with each command's status (`registered`, `already_registered`, `refused`, `not_sent`), `applied` empty and a warning. When a command's outcome is unknown, the error names the registered commands within the 512 characters Flow Steward keeps of an error message.
    - A step that changes data and ends without sending anything reports no external effect (as a test run does), with `processing` empty and `applied` false.
    - Requests nested deeper than 32 levels are refused before they are read; Allegro answers nested deeper than 48 levels are not read: a read fails with `invalid_response`, a confirmed change keeps its status, address and `processing` with `data` empty and a warning.
    - When a confirmed change's result is too large for the step output, the step still succeeds with the result cut to its identifiers and short values and a warning; the output budget measures amounts as they are written.
    - The `Location` and other returned headers have the access token removed before they reach the result.
    - Output budget, as the host (Flow Steward 0.9.16) measures it: at most 3.5 MB written, 2 million values and keys and 48 nesting levels; strings and rows are no longer counted, so a page of 1000 offers or 100 orders fits. When the first page of Get all my offers, Get orders or Get order events does not fit, it is asked again with half as many records; when a later page does not fit, the step returns what fits with where to continue.
    - Get all my offers, Get orders and Get order events: a rate limit, a server error or a network failure after the first page returns the pages already read with `complete` false, where to continue and a warning.
    - A change Allegro confirmed with a documented success status stays confirmed when its answer is too large, too late or cut off: the step returns the status, address and `processing` with `data` empty and a warning. Where the specification documents only JSON for that status, a body of another type is an unknown outcome (`invalid_response`), to be checked in Allegro.
    - Steps that change data return `retry_after_seconds`: the wait Allegro asks for with HTTP 202.
    - Update stock and prices: with a batch key already used, Allegro answers that the command exists; nothing is sent again, the step reads that command's outcome into `outcome` (or `unknown`) and asks for a new batch key for every update. However the result is cut for the output, `check` and each command's ID and status are kept.
    - An impossible date or time (2026-02-31, 25:00) is refused before anything is sent. Error answers carry an empty `warnings` list. A CSV file from Allegro has the access token removed like any answer; binary files are saved as sent.

    ## 0.1.0 — 2026-11-18

    First release, built on the Allegro REST API specification downloaded 2026-11-18 (OpenAPI 3.0.0, SHA-256 `f82541bb821c050d50f27792705090acfa4cb8d4f9796b60463cefc79fea14b9`).

    - Every one of the 270 documented operations is a step: offers and batch offer changes, products and categories, pricing and promotion, orders, returns, disputes and messages, shipping and delivery, account and fulfillment.
    - Everyday steps: Test connection, Get all my offers, Update stock and prices, Get stock and price update results, Get orders and Get order events.
    - Connections are Allegro or Allegro Sandbox accounts, authorized through your Allegro application; Flow Steward keeps and renews the authorization.
    - Amounts are exact decimals. Changes are sent once and never retried automatically; test runs never send them.
