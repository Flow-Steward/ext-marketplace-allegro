page_id: allegro-api-account
title: 'Allegro API: Account and fulfillment'
description: The 37 account and fulfillment steps.
components:
- component_id: steps_information_about_user
  type: markdown
  title: Information about user
  body: |
    ### Get my ratings

    Use this resource to receive your sales ratings sorted by last change date, starting from the latest. Needs the Allegro permission allegro:api:ratings.

    Action id `get_my_ratings` · reads only · Allegro: `GET /sale/user-ratings`

    Inputs: `recommended`, `last_changed_at_gte`, `last_changed_at_lte`, `offset`, `limit`, `accept_language`.

    ### Get rating

    Use this resource to receive your sales rating by given rating id. Needs the Allegro permission allegro:api:ratings.

    Action id `get_rating` · reads only · Allegro: `GET /sale/user-ratings/{ratingId}`

    Inputs: `rating_id` (required), `accept_language`.

    ### Get sales quality

    Use this resource to get current sales quality with at most 30 days history. Needs the Allegro permission allegro:api:profile:read.

    Action id `get_sales_quality` · reads only · Allegro: `GET /sale/quality`

    Inputs: `accept_language`.

    ### Get my account

    Use this resource when you need basic information about authenticated user. Needs the Allegro permission allegro:api:profile:read.

    Action id `get_my_account` · reads only · Allegro: `GET /me`

    Inputs: `accept_language`.

    ### Get additional e-mails

    Use this resource to get a list of all additional email addresses assigned to account. Needs the Allegro permission allegro:api:profile:read.

    Action id `get_additional_emails` · reads only · Allegro: `GET /account/additional-emails`

    Inputs: `accept_language`.

    ### Get additional e-mail

    Use this resource to retrieve a single additional email. Needs the Allegro permission allegro:api:profile:read.

    Action id `get_additional_email` · reads only · Allegro: `GET /account/additional-emails/{emailId}`

    Inputs: `email_id` (required), `accept_language`.

    ### Get my Smart! report

    Use this resource to get a full Smart! seller classification report. Needs the Allegro permission allegro:api:profile:read.

    Action id `get_my_smart_report` · reads only · Allegro: `GET /sale/smart`

    Inputs: `marketplace_id`, `accept_language`.

    ### Add additional e-mail

    Use this resource to add a new additional email address to account. Needs the Allegro permission allegro:api:profile:write.

    Action id `add_additional_email` · changes data in Allegro · Allegro: `POST /account/additional-emails`

    Inputs: `accept_language`, `body` (required).

    ### Answer rating

    Use this resource to answer for received rating. Needs the Allegro permission allegro:api:ratings.

    Action id `answer_rating` · changes data in Allegro · Allegro: `PUT /sale/user-ratings/{ratingId}/answer`

    Inputs: `rating_id` (required), `accept_language`, `body` (required).

    ### Request rating removal

    Use this resource to request removal of received rating. Needs the Allegro permission allegro:api:ratings.

    Action id `request_rating_removal` · changes data in Allegro · Allegro: `PUT /sale/user-ratings/{ratingId}/removal`

    Inputs: `rating_id` (required), `accept_language`, `body` (required).

    ### Delete additional e-mail

    Use this resource to delete one of additional emails. Needs the Allegro permission allegro:api:profile:write.

    Action id `delete_additional_email` · changes data in Allegro · Allegro: `DELETE /account/additional-emails/{emailId}`

    Inputs: `email_id` (required), `accept_language`.
- component_id: steps_public_user_information
  type: markdown
  title: Public user information
  body: |
    ### Get user's ratings summary

    Use this resource to receive feedback statistics. Needs the Allegro permission allegro:api:profile:read.

    Action id `get_user_ratings_summary` · reads only · Allegro: `GET /users/{userId}/ratings-summary`

    Inputs: `user_id` (required), `accept_language`.
- component_id: steps_information_about_marketplaces
  type: markdown
  title: Information about marketplaces
  body: |
    ### Get marketplaces

    Use this resource to get information about all the marketplaces on the platform. The specification names no Allegro permission for it.

    Action id `get_marketplaces` · reads only · Allegro: `GET /marketplaces`

    Inputs: `accept_language`.
- component_id: steps_billing
  type: markdown
  title: Billing
  body: |
    ### Get billing entries

    Use this resource to get a list of billing entries. The billing entries are sorted in descending order (newest first) by the date on which they occurred. Needs the Allegro permission allegro:api:billing:read.

    Action id `get_billing_entries` · reads only · Allegro: `GET /billing/billing-entries`

    Inputs: `marketplace_id`, `occurred_at_gte`, `occurred_at_lte`, `type_id`, `offer_id`, `order_id`, `limit`, `offset`, `accept_language`.

    ### Get billing types

    Use this resource to get a list of all billing types. Type names are localized according to the "Accept-Language" header. The specification names no Allegro permission for it.

    Action id `get_billing_types` · reads only · Allegro: `GET /billing/billing-types`

    Inputs: `accept_language`.
- component_id: steps_conversions
  type: markdown
  title: Conversions
  body: |
    ### Get CPS conversions

    Use this resource to find your CPS (Cost Per Sale) conversions for specific filters. The response contains a list of CPS conversions that correspond with the specified parameters. Beta in Allegro: it may still change. Needs the Allegro permission allegro:api:affiliate:read.

    Action id `get_cps_conversions` · reads only · Allegro: `GET /affiliate/conversions/cps`

    Inputs: `order_created_at_gte`, `order_created_at_lte`, `last_modified_at_gte`, `last_modified_at_lte`, `status`, `offset`, `limit`, `include_publisher_url_parameters`, `accept_language`.
- component_id: steps_advance_ship_notices
  type: markdown
  title: Advance Ship Notices
  body: |
    ### Get advance ship notices

    Use this resource to get a list of Advance Ship Notices. The list is ordered by createdAt property. Default offset is 0, default limit is 50. A list can be filtered by statuses. Multiple status query parameters are allowed. In such cases, filters are joined with OR logical operator. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_advance_ship_notices` · reads only · Allegro: `GET /fulfillment/advance-ship-notices`

    Inputs: `offset`, `limit`, `status`, `accept_language`.

    ### Get advance ship notice

    Use this resource to get an Advance Ship Notice. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_advance_ship_notice` · reads only · Allegro: `GET /fulfillment/advance-ship-notices/{id}`

    Inputs: `id` (required), `accept_language`.

    ### Download advance ship notice labels

    Use this resource to get labels for Advance Ship Notice. The answer is saved as a workflow file. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `download_advance_ship_notice_labels` · reads only · Allegro: `GET /fulfillment/advance-ship-notices/{id}/labels`

    Inputs: `id` (required), `accept_language`, `accept` (required).

    ### Get advance ship notice submission status

    Use this resource to get submit status of the Advance Ship Notice. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_advance_ship_notice_submission_status` · reads only · Allegro: `GET /fulfillment/submit-commands/{command-id}`

    Inputs: `command_id` (required), `accept_language`.

    ### Get advance ship notice receiving state

    Use this resource to check the state of Advance Ship Notice receiving in Fulfillment Center in real time. The response contains a receiving progress and information about particular items - their quantities and conditions. While the Advance Ship Notice is in UNPACKING state, report is updated dynamically, which might result in different responses even at short time intervals. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_advance_ship_notice_receiving_state` · reads only · Allegro: `GET /fulfillment/advance-ship-notices/{id}/receiving-state`

    Inputs: `id` (required), `accept_language`.

    ### Create advance ship notice

    Use this resource to create an Advance Ship Notice. Needs the Allegro permission allegro:api:fulfillment:write.

    Action id `create_advance_ship_notice` · changes data in Allegro · Allegro: `POST /fulfillment/advance-ship-notices`

    Inputs: `accept_language`, `body` (required).

    ### Update advance ship notice

    Use this resource to update an Advance Ship Notice. If a client wants to update read-only property, an error is returned (only in cases when sent value will be different than actual on the server). Needs the Allegro permission allegro:api:fulfillment:write.

    Action id `update_advance_ship_notice` · changes data in Allegro · Allegro: `PUT /fulfillment/advance-ship-notices/{id}`

    Inputs: `id` (required), `if_match` (required), `accept_language`, `body` (required).

    ### Cancel advance ship notice

    Use this resource to cancel an Advance Ship Notice in IN_TRANSIT status. Needs the Allegro permission allegro:api:fulfillment:write.

    Action id `cancel_advance_ship_notice` · changes data in Allegro · Allegro: `PUT /fulfillment/advance-ship-notices/{id}/cancel`

    Inputs: `id` (required), `accept_language`.

    ### Submit advance ship notice

    Use this resource to submit the Advance Ship Notice. After this operation, updates of the Advance Ship Notice are limited to selected properties only. See PUT /fulfillment/advance-ship-notices/{id}/submitted. Needs the Allegro permission allegro:api:fulfillment:write.

    Action id `submit_advance_ship_notice` · changes data in Allegro · Allegro: `PUT /fulfillment/submit-commands/{command-id}`

    Inputs: `command_id` (required), `accept_language`, `body` (required).

    ### Update submitted advance ship notice

    Use this resource to update already submitted Advance Ship Notice. Update is allowed only when Advance Ship Notice is in "IN_TRANSIT" status. Needs the Allegro permission allegro:api:fulfillment:write.

    Action id `update_submitted_advance_ship_notice` · changes data in Allegro · Allegro: `PUT /fulfillment/advance-ship-notices/{id}/submitted`

    Inputs: `id` (required), `if_match` (required), `accept_language`, `body` (required).

    ### Delete advance ship notice

    Use this resource to delete an Advance Ship Notice. Needs the Allegro permission allegro:api:fulfillment:write.

    Action id `delete_advance_ship_notice` · changes data in Allegro · Allegro: `DELETE /fulfillment/advance-ship-notices/{id}`

    Inputs: `id` (required), `accept_language`.
- component_id: steps_fulfillment_stock
  type: markdown
  title: Fulfillment Stock
  body: |
    ### Get fulfillment stock

    Use this resource to get a list of the products belonging to the seller, which are in Allegro Warehouse. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_fulfillment_stock` · reads only · Allegro: `GET /fulfillment/stock`

    Inputs: `offset`, `limit`, `phrase`, `sort`, `product_id`, `product_availability`, `product_status`, `asn_status`, `out_of_stock_in_from`, `out_of_stock_in_to`, `accept_language`.
- component_id: steps_fulfillment_products
  type: markdown
  title: Fulfillment Products
  body: |
    ### Get fulfillment products

    Use this resource to get a list of products that can be added to Advance Ship Notice. The list contains products for which the seller has created offers and is ordered by product's name. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_fulfillment_products` · reads only · Allegro: `GET /fulfillment/available-products`

    Inputs: `offset`, `limit`, `accept_language`.
- component_id: steps_fulfillment_parcels
  type: markdown
  title: Fulfillment Parcels
  body: |
    ### Get shipped parcels of order

    Use this resource to get list of parcels and included items for a given order. Items include detailed information such as expiration dates and serial numbers. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_shipped_parcels_of_order` · reads only · Allegro: `GET /fulfillment/orders/{orderId}/parcels`

    Inputs: `order_id` (required), `accept_language`.
- component_id: steps_fulfillment_returns
  type: markdown
  title: Fulfillment Returns
  body: |
    ### Get refund dispositions report

    Use this resource to get refund dispositions for returns handled in One Fulfillment. The response contains data from the last 90 days only. The response contains both buyer returns and operational returns. When there is no matching disposition, the report array is empty. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_refund_dispositions_report` · reads only · Allegro: `GET /fulfillment/returns/refund-dispositions`

    Inputs: `created_at_gte`, `created_at_lte`, `limit`, `offset`, `accept_language`.
- component_id: steps_fulfillment_removal
  type: markdown
  title: Fulfillment Removal
  body: |
    ### Get fulfillment removal preference

    Use this resource to read your current removal preference. Removal preference is associated with system removal order at the moment of removal order is created. It means there can be not yet fulfilled removal orders associated with previously set removal preference. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_fulfillment_removal_preference` · reads only · Allegro: `GET /fulfillment/removal/preferences`

    Inputs: `accept_language`.

    ### Set fulfillment removal preference

    Use this resource to create new active removal preference. From the moment the preference is set, it becomes the active one, and all new system removal orders will be associated with this preference. Removal preference is associated with system removal order at the moment of removal order is created. It means there can be not yet fulfilled removal orders associated with previously set removal preference. Needs the Allegro permission allegro:api:fulfillment:write.

    Action id `set_fulfillment_removal_preference` · changes data in Allegro · Allegro: `PUT /fulfillment/removal/preferences`

    Inputs: `accept_language`, `body` (required).
- component_id: steps_fulfillment_warehouse
  type: markdown
  title: Fulfillment Warehouse
  body: |
    ### Get fulfillment warehouse

    Use this resource to get the warehouse assigned to the seller. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_fulfillment_warehouse` · reads only · Allegro: `GET /fulfillment/warehouse`

    Inputs: `accept_language`.
- component_id: steps_tax_identification_number
  type: markdown
  title: Tax Identification Number
  body: |
    ### Get tax identification number

    Use this resource to get tax identification number with verification status. After adding or updating the tax identification number the status will be NOT_VERIFIED and you will have to wait for acceptance status to start selling. Needs the Allegro permission allegro:api:fulfillment:read.

    Action id `get_tax_identification_number` · reads only · Allegro: `GET /fulfillment/tax-id`

    Inputs: `accept_language`.

    ### Add tax identification number

    Use this resource to add tax identification number. For international sellers only. Needs the Allegro permission allegro:api:fulfillment:write.

    Action id `add_tax_identification_number` · changes data in Allegro · Allegro: `POST /fulfillment/tax-id`

    Inputs: `accept_language`, `body` (required).

    ### Update tax identification number

    Use this resource to update tax identification number. For international sellers only. Needs the Allegro permission allegro:api:fulfillment:write.

    Action id `update_tax_identification_number` · changes data in Allegro · Allegro: `PUT /fulfillment/tax-id`

    Inputs: `accept_language`, `body` (required).
