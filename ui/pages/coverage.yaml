components:
- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    The Allegro REST API specification (OpenAPI 3.0.0, downloaded 2026-11-18, SHA-256 `f82541bb821c…`) documents 270 operations; **270 of them have their own step** in this version.

    - **156 reads** (GET).
    - **114 changes**: 55 POST, 39 PUT, 5 PATCH and 15 DELETE. Every one is a change for Flow Steward, also the few that Allegro uses to calculate or query, so test runs never send them.
    - **6 steps save a file** (PDF, labels, attachments) and **7 upload one**.
    - **15 steps are beta** and **8 deprecated** in Allegro.

    The everyday steps on top: test the connection, get all your offers, update stock and prices of many offers, read the outcome of that update, and get orders and order events.
