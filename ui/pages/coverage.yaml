description: What of the documented Allegro REST API the steps offer.
components:
- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    The Allegro REST API specification (OpenAPI 3.0.0, downloaded 2026-11-18, SHA-256 `f82541bb821c…`) documents 270 operations; **270 of them have their own step** in this version.

    - **162 reads**: 156 GET and 6 POST that Allegro documents as retrieving, calculating, querying or parsing (labels, protocols, pickup proposals, fee preview, Allegro Prices query, ingredients). Test runs send reads.
    - **108 changes**: 49 POST, 39 PUT, 5 PATCH and 15 DELETE. Test runs never send them. 19 of them register a command or request that Allegro applies afterwards; they return processing accepted and name the step that reads the outcome.
    - **7 steps save a file** (PDF, labels, attachments, CSV) and **7 upload one**.
    - **15 steps are beta** and **8 deprecated** in Allegro.

    The everyday steps on top: test the connection, get all your offers, update stock and prices of many offers, read the outcome of that update, and get orders and order events.
