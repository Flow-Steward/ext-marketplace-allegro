    label: delivery.shippingRates.id
    widget_type: text
    required: false
    help_text: The ID of shipping rates. Returns offers with given shipping rates ID.
  - name: delivery_shipping_rates_id_empty
    label: delivery.shippingRates.id.empty
    widget_type: boolean
    required: false
    help_text: Allows to filter offers by existence of shipping rates ID.
  - name: sort
    label: sort
    widget_type: select
    required: false
    help_text: The results' sorting order. No prefix in the value means ascending order. - prefix means
      descending order. If you don't provide the sort parameter, the list is sorted by offer creation
      time, descending. If additionally a publication.marketplace is provided, sorts by price and stock.sold
      using the data on the given marketplace.
