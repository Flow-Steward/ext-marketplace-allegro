- operation_id: list_all_my_offers
  title: Get all my offers
  fields:
  - name: name
    label: Title contains
    widget_type: text
    required: false
    help_text: Text to search in the offer title.
  - name: offer_ids
    label: Offer IDs
    widget_type: json
    required: false
    help_text: Only these offers.
    placeholder: '[]'
  - name: external_ids
    label: External IDs
    widget_type: json
    required: false
    help_text: Only offers with these IDs from your own system (external.id).
    placeholder: '[]'
  - name: publication_status
    label: Publication status
    widget_type: multi_select
    required: false
    help_text: Only offers with any of these statuses. All statuses when empty.
    options:
    - label: INACTIVE
      value: INACTIVE
    - label: ACTIVATING
      value: ACTIVATING
    - label: ACTIVE
      value: ACTIVE
    - label: ENDED
      value: ENDED
  - name: category_id
    label: Category ID
    widget_type: text
    required: false
    help_text: Only offers in this category.
  - name: start_offset
    label: Start at
    widget_type: integer
    required: false
    help_text: 'The offset to start at: 0, or next_offset of an earlier run.'
  - name: max_offers
    label: At most
    widget_type: integer
    required: false
    help_text: The most offers to read in this step. Default 100000.
  - name: output
    label: Return as
    widget_type: select
    required: false
    help_text: 'step: in the step output (default). file: one JSON workflow file of up to 40 MB, for long
      lists.'
    options:
    - label: step
      value: step
    - label: file
      value: file
