    help_text: The lower threshold of price. If additionally a publication.marketplace is provided, searches
      using the price on the given marketplace.
  - name: selling_mode_price_amount_lte
    label: sellingMode.price.amount.lte
    widget_type: text
    required: false
    help_text: The upper threshold of price. If additionally a publication.marketplace is provided, searches
      using the price on the given marketplace.
  - name: selling_mode_price_automation_rule_id
    label: sellingMode.priceAutomation.rule.id
    widget_type: text
    required: false
    help_text: The ID of price automation rule. Returns offers with given price automation rule ID. If
      additionally a publication.marketplace is provided, searches using the price automation rule on
      the given marketplace.
  - name: selling_mode_price_automation_rule_id_empty
    label: sellingMode.priceAutomation.rule.id.empty
    widget_type: boolean
    required: false
    help_text: Allows to filter offers by existence of price automation rule ID. Passing 'false' will
      return offers with any price automation rule, passing 'true' will return offers without any price
      automation rules. If additionally a publication.marketplace is provided, searches using the price
      automation rule on the given marketplace.
  - name: publication_status
    label: publication.status
    widget_type: multi_select
    required: false
    help_text: 'The publication status of the offer. Passing more than one value will search for offers
      with any of the given statuses. By default all statuses are included. Example: publication.status=INACTIVE&publication.status=ACTIVE
      - returns offers with status INACTIVE or ACTIVE.'
    options:
    - label: INACTIVE
      value: INACTIVE
    - label: ACTIVE
      value: ACTIVE
    - label: ACTIVATING
      value: ACTIVATING
    - label: ENDED
      value: ENDED
  - name: publication_marketplace
    label: publication.marketplace
    widget_type: text
    required: false
    help_text: Either the base marketplace or an additional marketplace of the offer. When passing the
      parameter publication.marketplace, searches for offers with the given marketplace as either its
      base marketplace or one of its additional marketplaces. When the parameter is omitted, searches
      for offers with all marketplaces. In addition to searching, passing the parameter also influences
      the functionality o…
  - name: selling_mode_format
    label: sellingMode.format
    widget_type: multi_select
    required: false
    help_text: 'The offer''s selling format. Passing more than one value will search for offers with any
      of the given formats. By default all formats are included. Example: sellingMode.format=BUY_NOW&sellingMode.format=ADVERTISEMENT
      - returns offers with with format BUY_NOW or ADVERTISEMENT.'
    options:
    - label: BUY_NOW
      value: BUY_NOW
    - label: ADVERTISEMENT
      value: ADVERTISEMENT
    - label: AUCTION
      value: AUCTION
  - name: external_id
    label: external.id
    widget_type: json
    required: false
    help_text: 'The ID from the client''s external system. Passing more than one value will search for
      offers with any of the given IDs. By default no ID is included. Example: external.id=1233&external.id=1234
      - returns offers with ID 1233 or 1234. Single ID length shouldn''t exceed 100 characters.'
    placeholder: '[]'
