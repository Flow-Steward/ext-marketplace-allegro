        only one carrier involved in a parcel shipment.
  - name: parcels_sender_phone_number
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: parcels.sender.phoneNumber
      description: One or more phone numbers.
  - name: reference_number
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: referenceNumber
      description: One or more reference numbers.
  - name: from
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: from
      description: The ID of the last seen customer return. Customer returns created after the given customer
        return will be returned.
  - name: created_at_gte
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: createdAt.gte
      description: Date of the return in ISO 8601 format to search by greater or equal.
  - name: created_at_lte
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: createdAt.lte
      description: Date of the return in ISO 8601 format to search by lower or equal.
  - name: updated_at_gte
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: updatedAt.gte
