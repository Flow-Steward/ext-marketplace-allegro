- operation_id: update_stock_and_prices
  display_name: Update stock and prices
  description: 'Sets the stock and the Buy Now price of many offers with Allegro''s batch commands: offers
    with the same new stock or the same new price go into one command of up to 1000 offers. Each command
    ID is derived from batch_key and the command''s content, so running the step again with the same rows
    and batch key never registers a change twice: Allegro answers that the command already exists. The
    step confirms that Allegro registered the commands (processing accepted, applied false); Allegro applies
    them afterwards, and Get stock and price update results reads the outcome per offer. When Allegro
    certainly refuses a command after earlier ones were registered, or time runs out before the next one
    is sent, the step still succeeds: each command has its status, applied is empty and a warning says
    what to fix before running it again. Stock must be at least 1 and a price is an exact decimal with
    at most two places. Needs allegro:api:sale:offers:write.'
  operation_kind: action
  category: sales
  connection_type_ids:
  - allegro
  - allegro_sandbox
  workflow_visible: true
  effect_kind: allegro_update_stock_and_prices
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: rows
    value_type: array
    required: true
    schema:
      title: Offers
      type: array
      minItems: 1
      maxItems: 20000
      items:
        type: object
        additionalProperties: false
        required:
        - offer_id
        properties:
          offer_id:
            type: string
            maxLength: 30
            description: The Allegro offer ID.
          quantity:
            type: integer
            minimum: 1
            maximum: 1000000
            description: The new stock.
          price:
            type:
            - number
            - string
            description: The new Buy Now price, for example 49.99.
          currency:
            type: string
            pattern: ^[A-Z]{3}$
            description: The price's currency. Default PLN.
      description: 'One row per offer: offer_id and the new quantity, price or both.'
  - name: batch_key
    value_type: text
    required: true
    schema:
      title: Batch key
      description: 'Your name for this batch: use a new key for every update, for example the export run
        ID. The same rows with a key already used are never applied again: Allegro answers that the command
        exists, nothing is sent again and the step reads that command''s outcome.'
      type: string
      minLength: 1
      maxLength: 100
  outputs:
  - name: commands
    value_type: array
    schema:
      type: array
      items:
        type: object
        additionalProperties: true
      description: 'Each command: command_id, kind (quantity or price), value, currency, offers_count
        and status: registered, already_registered, refused (Allegro certainly refused it after earlier
        commands were registered) or not_sent; and outcome: for already_registered, how far Allegro got
        with the command registered earlier (completed, total, success, failed, waiting) or unknown when
        it could not be read; empty for the others.'
  - name: offers_count
    value_type: integer
    schema:
      type: integer
      description: How many offers the commands cover.
  - name: processing
    value_type: text
    schema:
      type: &id003
      - string
      - 'null'
      enum: &id004
      - completed
      - accepted
      - null
      description: 'completed: Allegro answered that the change is made. accepted: Allegro accepted the
        request (HTTP 202) or registered the command, and applies it afterwards; check the outcome with
        the step named in check. None in a test run and when nothing was sent.'
  - name: applied
    value_type: boolean
    schema:
      type: &id005
      - boolean
      - 'null'
      description: True with processing completed. False with processing accepted (the outcome is read
        with the check step), in a test run and when nothing was sent. Empty when only part of a batch
        was registered.
  - name: check
    value_type: object
    schema:
      type: &id006
      - object
      - 'null'
      additionalProperties: true
      description: 'With processing accepted: operation_id, the step that reads the outcome (none when
        Allegro documents no such step), and location, the address Allegro returned for it (none when
        it sent none).'
  - name: retry_after_seconds
    value_type: integer
    schema:
      type: &id007
      - integer
      - 'null'
      description: 'With HTTP 202: the seconds Allegro asks to wait (Retry-After) before checking the
