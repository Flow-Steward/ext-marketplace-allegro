        - ACTIVE
        - ACTIVATING
        - ENDED
      maxItems: 1000
      title: publication.status
      description: 'The publication status of the offer. Passing more than one value will search for offers
        with any of the given statuses. By default all statuses are included. Example: publication.status=INACTIVE&publication.status=ACTIVE
        - returns offers with status INACTIVE or ACTIVE.'
  - name: publication_marketplace
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: publication.marketplace
      description: Either the base marketplace or an additional marketplace of the offer. When passing
        the parameter publication.marketplace, searches for offers with the given marketplace as either
        its base marketplace or one of its additional marketplaces. When the parameter is omitted, searches
        for offers with all marketplaces. In addition to searching, passing the parameter also influences
        the functionality o…
  - name: selling_mode_format
    value_type: array
    required: false
    schema:
      type: array
      items:
        type: string
        enum:
        - BUY_NOW
        - ADVERTISEMENT
        - AUCTION
      maxItems: 1000
      title: sellingMode.format
      description: 'The offer''s selling format. Passing more than one value will search for offers with
        any of the given formats. By default all formats are included. Example: sellingMode.format=BUY_NOW&sellingMode.format=ADVERTISEMENT
        - returns offers with with format BUY_NOW or ADVERTISEMENT.'
