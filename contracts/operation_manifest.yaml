  display_name: Propose product
  description: Use this resource to propose a product. You can add up to 20,000 new products to the Catalog
    each month. Needs the Allegro permission allegro:api:sale:offers:write.
  operation_kind: action
  category: sales
  connection_type_ids:
  - allegro
  - allegro_sandbox
  workflow_visible: true
  effect_kind: allegro_propose_product
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: accept_language
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      enum:
      - en-US
      - pl-PL
      - uk-UA
      - sk-SK
      - cs-CZ
      - hu-HU
      title: Accept-Language
      description: Expected language of messages.
  - name: body
    value_type: object
    required: true
    schema:
      type: object
      additionalProperties: true
      title: Request body
      description: 'The JSON body Allegro documents for proposeSaleProduct (required fields: category,
        images, language, name, parameters). Amounts as text, for example "49.99".'
  outputs:
  - name: status
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Allegro's HTTP status (none in a test run).
