- operation_id: create_offer_from_product
  display_name: Create offer from product
  description: 'Use this resource to create offer based on product. Note that requests may be limited.
    When Allegro answers HTTP 202 it has accepted the request and applies it afterwards: the step returns
    processing "accepted" and applied false. Get the outcome with Check offer processing status. Needs
    the Allegro permission allegro:api:sale:offers:write.'
  operation_kind: action
  category: sales
  connection_type_ids:
  - allegro
  - allegro_sandbox
  workflow_visible: true
  effect_kind: allegro_create_offer_from_product
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: accept_language
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      enum:
      - en-US
      - pl-PL
      - uk-UA
      - sk-SK
      - cs-CZ
      - hu-HU
      title: Accept-Language
      description: Expected language of messages.
  - name: body
    value_type: object
    required: true
    schema:
      type: object
      additionalProperties: true
      title: Request body
      description: 'The JSON body Allegro documents for createProductOffers (required fields: stock).
        Amounts as text, for example "49.99".'
  outputs:
  - name: status
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Allegro's HTTP status (none in a test run).
  - name: data
    value_type: object
    schema:
      type:
      - object
      - array
      - string
      - number
      - boolean
      - 'null'
      description: What Allegro returned (JSON).
      additionalProperties: true
  - name: processing
    value_type: text
    schema:
      type: *id003
      enum: *id004
      description: 'completed: Allegro answered that the change is made. accepted: Allegro accepted the
        request (HTTP 202) or registered the command, and applies it afterwards; check the outcome with
        the step named in check. None in a test run and when nothing was sent.'
  - name: applied
    value_type: boolean
    schema:
      type: *id005
      description: True with processing completed. False with processing accepted (the outcome is read
        with the check step), in a test run and when nothing was sent. Empty when only part of a batch
        was registered.
  - name: check
    value_type: object
    schema:
      type: *id006
      additionalProperties: true
      description: 'With processing accepted: operation_id, the step that reads the outcome (none when
        Allegro documents no such step), and location, the address Allegro returned for it (none when
        it sent none).'
  - name: retry_after_seconds
    value_type: integer
    schema:
      type: *id007
      description: 'With HTTP 202: the seconds Allegro asks to wait (Retry-After) before checking the
        outcome. Empty otherwise.'
  - name: location
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: 'The Location header, when Allegro sends one (for an accepted request: where Allegro
        reports its outcome).'
  - name: etag
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The ETag header, when Allegro sends one (the version for if_match).
  - name: warnings
    value_type: array
    schema:
      type: array
      items: *id001
      description: What the step could not do fully or what to check.
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.status
  - result.data
  - result.processing
  - result.applied
  - result.check
  - result.retry_after_seconds
  - result.location
  - result.etag
  - result.warnings
  - result.external_effect_status
  - result.definitely_no_external_effect
  error_codes: *id008
