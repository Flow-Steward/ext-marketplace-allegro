- operation_id: get_orders_page
  display_name: Get orders page
  description: Use this resource to get an order list. Needs the Allegro permission allegro:api:orders:read.
  operation_kind: source
  category: sales
  connection_type_ids:
  - allegro
  - allegro_sandbox
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: offset
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      title: offset
      description: Index of first returned checkout-form from all search results.
  - name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      title: limit
      description: Maximum number of checkout-forms in response.
  - name: status
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: status
      description: 'Specify status value that checkout-forms must have to be included in the output. Allowed
        values are: BOUGHT: purchase without checkout form filled in. FILLED_IN: checkout form filled
        in but payment is not completed yet so data could still change. READY_FOR_PROCESSING: payment
        completed. Purchase is ready for processing. CANCELLED: purchase cancelled by buyer.'
  - name: fulfillment_status
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: fulfillment.status
      description: 'Specify seller status value that checkout-forms must have to be included in the output.
        Allowed values are: NEW PROCESSING READY_FOR_SHIPMENT READY_FOR_PICKUP SENT PICKED_UP CANCELLED
        SUSPENDED RETURNED.'
  - name: fulfillment_provider_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: fulfillment.provider.id
      description: 'Specify filter for order management provider. Allowed values are: SELLER: for orders
        managed directly by seller ALLEGRO: for orders managed by Allegro warehouse (One Fulfillment).'
  - name: fulfillment_shipment_summary_line_items_sent
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: fulfillment.shipmentSummary.lineItemsSent
      description: 'Specify filter for line items sending status. Allowed values are: NONE: none of line
        items have tracking number specified SOME: some of line items have tracking number specified ALL:
        all of line items have tracking number specified.'
  - name: line_items_bought_at_lte
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: lineItems.boughtAt.lte
      description: Latest line item bought date. The upper bound of date time range from which checkout
        forms will be taken.
  - name: line_items_bought_at_gte
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: lineItems.boughtAt.gte
      description: Latest line item bought date. The lower bound of date time range from which checkout
        forms will be taken.
  - name: payment_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: payment.id
      description: Find checkout-forms having specified payment id.
  - name: surcharges_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: surcharges.id
      description: Find checkout-forms having specified surcharge id.
  - name: delivery_method_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: delivery.method.id
      description: Find checkout-forms having specified delivery method id.
  - name: buyer_login
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: buyer.login
      description: Find checkout-forms having specified buyer login.
  - name: marketplace_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: marketplace.id
      description: Find checkout-forms of orders purchased on specified marketplace.
  - name: updated_at_lte
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: updatedAt.lte
      description: Checkout form last modification date. The upper bound of date time range from which
        checkout forms will be taken.
  - name: updated_at_gte
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: updatedAt.gte
      description: Checkout form last modification date. The lower bound of date time range from which
        checkout forms will be taken.
  - name: sort
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      enum:
      - lineItems.boughtAt
      - -lineItems.boughtAt
      - updatedAt
      - -updatedAt
      title: sort
      description: The results' sorting order. No prefix in the value means ascending order. - prefix
