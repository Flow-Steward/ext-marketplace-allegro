      description: The ETag header, when Allegro sends one (the version for if_match).
  - name: warnings
    value_type: array
    schema:
      type: array
      items: *id001
      description: What the step could not do fully or what to check.
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.status
  - result.data
  - result.processing
  - result.applied
  - result.check
  - result.retry_after_seconds
  - result.location
  - result.etag
  - result.warnings
  - result.external_effect_status
  - result.definitely_no_external_effect
  error_codes: *id008
