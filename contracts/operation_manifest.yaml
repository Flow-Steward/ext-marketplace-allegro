- operation_id: get_fulfillment_stock
  display_name: Get fulfillment stock
  description: Use this resource to get a list of the products belonging to the seller, which are in Allegro
    Warehouse. With format csv the answer is saved as a workflow file. Needs the Allegro permission allegro:api:fulfillment:read.
  operation_kind: source
  category: sales
  connection_type_ids:
  - allegro
  - allegro_sandbox
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: offset
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      title: offset
      description: The offset of elements in the response. Ignored for text/csv content type.
  - name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 1000
      title: limit
      description: Maximum number of elements in response. Ignored for text/csv content type.
  - name: phrase
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      minLength: 3
      title: phrase
      description: Filtering search results by product name.
  - name: sort
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      enum:
      - available
      - -available
      - unfulfillable
      - -unfulfillable
      - name
      - -name
      - lastFourteenDaysSalesAverage
      - -lastFourteenDaysSalesAverage
      - reserve
      - -reserve
      - lastThirtyDaysSalesSum
      - -lastThirtyDaysSalesSum
      - storageFee
      - -storageFee
      title: sort
      description: 'Defines how elements are sorted in response. Minus sign can be added to imply descending
        sort order. Ignored for text/csv content type. Possible values for the "sort" parameter: available
        - sorting by quantity of available products (descending) available - sorting by quantity of available
        products (ascending) unfulfillable - sorting by quantity of unfulfillable products (descending)
        unf…'
  - name: product_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: productId
      description: Filtering search results by fulfillment product identifier. Ignored for text/csv content
        type.
  - name: product_availability
    value_type: array
    required: false
    schema:
      type: array
      items:
        type: string
        enum:
        - SUFFICIENT
        - UNAVAILABLE
        - LOW
      maxItems: 1000
      title: productAvailability
      description: Filtering search results by availability.
  - name: product_status
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      enum:
      - UNFULFILLABLE
      title: productStatus
      description: Filtering search results by status.
  - name: asn_status
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      enum:
      - SUBMITTED
      - NOT_FOUND
      title: asnStatus
      description: 'Filtering search results by ASN status. Following values are allowed: SUBMITTED -
        Advanced Ship Notice document has been submitted and it contains a particular product. Only the
        products that have ASN with products on it are returned. NOT_FOUND - Advanced Ship Notice that
        contains a particular product was not found. It has not been submitted, may be expired, or products
        have already been delivere…'
  - name: out_of_stock_in_from
    value_type: integer
    required: false
    schema:
      type: integer
      title: outOfStockInFrom
      description: Filter by products with outOfStockIn greater than or equal.
  - name: out_of_stock_in_to
    value_type: integer
    required: false
    schema:
      type: integer
      title: outOfStockInTo
      description: Filter by products with outOfStockIn less than or equal.
  - name: accept_language
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      enum:
      - en-US
      - pl-PL
      - uk-UA
      - sk-SK
      - cs-CZ
      - hu-HU
      title: Accept-Language
      description: Expected language of messages.
  - name: format
    value_type: text
    required: false
    schema:
      type: string
      enum:
      - json
      - csv
      title: Format
      description: 'json (default): Allegro''s answer in data. csv: the answer as a workflow file in file.
        offset, limit, sort, product_id do not apply with csv (Allegro ignores them for that format).'
  outputs:
  - name: status
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Allegro's HTTP status (none in a test run).
  - name: data
    value_type: object
    schema:
      type:
      - object
      - array
      - string
      - number
      - boolean
      - 'null'
      description: What Allegro returned (JSON).
