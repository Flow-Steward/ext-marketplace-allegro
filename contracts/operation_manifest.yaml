- operation_id: get_customer_returns
  display_name: Get customer returns
  description: 'Use this resource to get all customer returns filtered by query parameters. This resource
    is limited to 25 requests per second for a single user and 50 requests per second for clientId. Beta
    in Allegro: it may still change. Needs the Allegro permission allegro:api:orders:read.'
  operation_kind: source
  category: sales
  connection_type_ids:
  - allegro
  - allegro_sandbox
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: customer_return_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: customerReturnId
      description: One or more customer return id's.
  - name: order_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: orderId
      description: One or more order id's.
  - name: buyer_email
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: buyer.email
      description: One or more buyer emails.
  - name: buyer_login
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: buyer.login
      description: One or more buyer logins.
  - name: items_offer_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: items.offerId
      description: One or more returned item offer id's.
  - name: items_name
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: items.name
      description: One or more item names.
  - name: parcels_waybill
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: parcels.waybill
      description: One or more waybill id's.
  - name: parcels_transporting_waybill
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: parcels.transportingWaybill
      description: Waybill ids as generated by carriers physically transporting the parcel. Will be null
        if there's only one carrier involved in a parcel shipment.
  - name: parcels_carrier_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: parcels.carrierId
      description: One or more carrier id's.
  - name: parcels_transporting_carrier_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
