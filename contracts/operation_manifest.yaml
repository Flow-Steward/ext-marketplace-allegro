    value_type: array
    required: false
    schema:
      type: array
      items:
        type: string
        maxLength: 100
      maxItems: 100
      title: external.id
      description: 'The ID from the client''s external system. Passing more than one value will search
        for offers with any of the given IDs. By default no ID is included. Example: external.id=1233&external.id=1234
        - returns offers with ID 1233 or 1234. Single ID length shouldn''t exceed 100 characters.'
