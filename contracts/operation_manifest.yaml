- operation_id: apply_for_badge
  display_name: Apply for badge
  description: 'This resource allows you to apply for a badge. Most badges involve additional fee charged.
    Your badge application will be verified and you will be notified about the verification status via
    e-mail. You can use *Location* provided in header of the response to track your application status.
    Application will be removed after 30 days when status of the application was changed form PROCESSED
    or DECLINED. Allegro registers the request and applies it afterwards: the step returns processing
    "accepted" and applied false. Get the outcome with Get badge application. Needs the Allegro permission
    allegro:api:campaigns.'
