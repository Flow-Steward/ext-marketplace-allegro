manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.allegro
kind: tool_provider
version: 0.1.0
release_stage: active
billing_mode: free
display_name: Allegro
description: |-
  Connect workflows to Allegro, the Polish online marketplace, through the Allegro REST API. Everyday steps read all your offers, update stock and prices of many offers at once and read the outcome, and read orders and order events.

  Every one of the 270 documented operations of the Allegro REST API has its own step: offers and batch changes, products and categories, pricing and promotion, orders, returns, disputes and messages, shipping and delivery, account and fulfillment. Amounts are exact decimals. A connection is one Allegro or Allegro Sandbox account, authorized through your own Allegro application.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-marketplace-allegro/issues
  website_url: https://github.com/Flow-Steward/ext-marketplace-allegro
listing:
  category: sales
  tags:
  - allegro
  - marketplace
  - poland
  - e-commerce
  - offers
  - orders
  summary: Read and update Allegro offers, stock and prices, orders, returns, shipments and messages.
  categories:
  - sales
  - inventory
  - orders
  setup_summary: Register an application at apps.developer.allegro.pl, add its Client ID and Client Secret
    to the connection, sign in to Allegro and run the connection test.
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_allegro
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: Each authorized Allegro account is a project connection; a project may hold several, for
    example a production account and a Sandbox account.
egress:
  hosts:
  - api.allegro.pl
  - upload.allegro.pl
  - api.allegro.pl.allegrosandbox.pl
  - upload.allegro.pl.allegrosandbox.pl
callbacks:
- callback_id: oauth_authorization
  purpose: oauth_authorization
  methods:
  - GET
  connection_scoped: false
