runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    oauth_providers:
    - provider_id: allegro
      display_name: Allegro
      description: Sign in to Allegro and allow your Allegro application to act for the account.
      setup_page_id: connection
      help_page_id: connection
      error_help_anchors:
        invalid_client: if-it-fails
        authorization_required: if-it-fails
      flow:
        type: authorization_code
        pkce: s256
      credential_fields:
      - field_id: client_id
        value_type: text
        required: true
        secret: false
        change_policy: reauthorization_required
        label: Client ID
        help_text: The Client ID of your application at apps.developer.allegro.pl.
        autocomplete: 'off'
        validation:
          min_length: 8
          max_length: 128
      - field_id: client_secret
        value_type: secret
        required: true
        secret: true
        change_policy: runtime_revalidate
        label: Client Secret
        help_text: The Client Secret of the same application.
        autocomplete: 'off'
        validation:
          min_length: 8
          max_length: 512
      authorization_endpoint:
        url: https://allegro.pl/auth/oauth/authorize
      token_endpoint:
        url: https://allegro.pl/auth/oauth/token
        client_auth_method: client_secret_basic
      callback_id: oauth_authorization
      authorization_intents:
      - intent_id: connect
        static_parameters:
          prompt: confirm
      post_connect_action_id: verify_identity
    - provider_id: allegro_sandbox
      display_name: Allegro Sandbox
      description: Sign in to Allegro Sandbox and allow your Allegro application to act for the account.
      setup_page_id: connection-sandbox
      help_page_id: connection-sandbox
      error_help_anchors:
        invalid_client: if-it-fails
        authorization_required: if-it-fails
      flow:
        type: authorization_code
        pkce: s256
      credential_fields:
      - field_id: client_id
        value_type: text
        required: true
        secret: false
        change_policy: reauthorization_required
        label: Client ID
        help_text: The Client ID of your application at apps.developer.allegro.pl.allegrosandbox.pl.
        autocomplete: 'off'
        validation:
          min_length: 8
          max_length: 128
      - field_id: client_secret
        value_type: secret
        required: true
        secret: true
        change_policy: runtime_revalidate
        label: Client Secret
        help_text: The Client Secret of the same application.
        autocomplete: 'off'
        validation:
          min_length: 8
          max_length: 512
